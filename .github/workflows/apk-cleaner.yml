# ==================================================
# 📄 FILE: apk-cleaner.yml — BURAHIN ANG .apk FILES!
# 🎯 PURPOSE: Delete ALL .apk files from specific folder (docs/)
# ✅ BAGO MAG-UPLOAD NG BAGONG APK — BURAHIN MUNA ANG LUMANG .apk!
# ==================================================

name: APK Cleaner — Burahin ang .apk Files

on:
  workflow_dispatch:
    inputs:
      target_folder:
        description: 'Folder na lilinisin — hal: docs/ | (iwanang walang laman = docs/)'
        required: false
        default: 'docs/'
      keep_latest:
        description: 'Panatilihin ang pinakabagong .apk? true / false'
        required: false
        default: 'false'

jobs:
  clean-apks:
    name: Burahin ang .apk Files
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4

      # ==================================================
      # 📂 TINGNAN ANG FOLDER — KUNG WALA, GUMAMIT NG docs/
      # ==================================================
      - name: 📂 Ihanda ang Folder
        id: folder
        run: |
          TARGET_FOLDER="${{ github.event.inputs.target_folder }}"
          
          # ✅ KUNG WALANG NAKALAGAY — docs/ ang gagamitin
          if [ -z "$TARGET_FOLDER" ]; then
            TARGET_FOLDER="docs/"
          fi
          
          # ✅ SIGURADUHIN MAY / SA DULO
          [[ "$TARGET_FOLDER" != */ ]] && TARGET_FOLDER="$TARGET_FOLDER/"
          
          echo "folder=$TARGET_FOLDER" >> $GITHUB_OUTPUT
          echo "🎯 Target Folder: $TARGET_FOLDER"
          
          # ✅ SIGURADUHIN MAY FOLDER
          mkdir -p "$TARGET_FOLDER"

      # ==================================================
      # 🗑️ ILISTA ANG LAHAT NG .apk — BAGO BURAHIN
      # ==================================================
      - name: 📋 Ilista ang mga .apk file bago burahin
        run: |
          TARGET_FOLDER="${{ steps.folder.outputs.folder }}"
          
          echo "=========================================="
          echo "   📋 MGA .apk FILE SA $TARGET_FOLDER"
          echo "=========================================="
          
          APK_COUNT=$(find "$TARGET_FOLDER" -maxdepth 2 -name "*.apk" -type f | wc -l)
          
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "✅ WALANG .apk FILE — WALANG BUBURAHIN!"
            echo "count=0" >> $GITHUB_ENV
            exit 0
          fi
          
          echo "Nakita: $APK_COUNT na .apk file(s)"
          echo ""
          find "$TARGET_FOLDER" -maxdepth 2 -name "*.apk" -type f -exec ls -lh {} \;
          echo ""
          
          echo "count=$APK_COUNT" >> $GITHUB_ENV

      # ==================================================
      # 🗑️ BURAHIN ANG LAHAT NG .apk — O KUNG KEEP_LATEST = TRUE, ISA LANG ANG IIWAN
      # ==================================================
      - name: 🗑️ Burahin ang mga .apk file
        id: delete
        run: |
          TARGET_FOLDER="${{ steps.folder.outputs.folder }}"
          KEEP_LATEST="${{ github.event.inputs.keep_latest }}"
          DELETED=0
          
          echo "=========================================="
          echo "   🗑️ PAGBURAHIN NG .apk FILES"
          echo "=========================================="
          
          if [ "$KEEP_LATEST" = "true" ]; then
            echo "📌 MODE: Panatilihin ang PINAKABAGONG .apk"
            # ✅ Kunin ang pinakabagong APK — huwag burahin
            LATEST_APK=$(find "$TARGET_FOLDER" -maxdepth 2 -name "*.apk" -type f -printf "%T@ %p\n" | sort -nr | head -n1 | cut -d' ' -f2-)
            
            if [ -n "$LATEST_APK" ]; then
              echo "✅ Pananatilihin: $LATEST_APK"
              # ✅ Burahin ang lahat — maliban sa pinakabago
              find "$TARGET_FOLDER" -maxdepth 2 -name "*.apk" -type f ! -path "$LATEST_APK" -delete -print | while read f; do
                echo "🗑️ BINURA: $(basename "$f")"
                DELETED=$((DELETED + 1))
              done
            else
              echo "⚠️ Walang nahanap na .apk"
            fi
          else
            echo "📌 MODE: BURAHIN ANG LAHAT NG .apk"
            # ✅ Burahin ang LAHAT — walang iiwan
            find "$TARGET_FOLDER" -maxdepth 2 -name "*.apk" -type f -delete -print | while read f; do
              echo "🗑️ BINURA: $(basename "$f")"
              DELETED=$((DELETED + 1))
            done
          fi
          
          echo ""
          echo "✅ TAPOS NA! Kabuuang binura: $DELETED na .apk file(s)"
          echo "deleted=$DELETED" >> $GITHUB_OUTPUT

      # ==================================================
      # ✅ I-COMMIT AT I-PUSH ANG PAGBABAGO
      # ==================================================
      - name: ✅ I-commit at i-push ang paglilinis
        if: env.count != '0'
        continue-on-error: true
        run: |
          TARGET_FOLDER="${{ steps.folder.outputs.folder }}"
          DELETED="${{ steps.delete.outputs.deleted }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add "$TARGET_FOLDER" 2>/dev/null || true
          
          git commit -m "🧹 Cleanup: Burahin ang $DELETED na .apk file(s) sa $TARGET_FOLDER" --allow-empty || true
          
          git push origin main || echo "⚠️ Hindi maipush — pero tapos na ang paglilinis!"
          
          echo ""
          echo "✅ LAHAT NG .apk — TINANGGAL NA SA $TARGET_FOLDER!"
