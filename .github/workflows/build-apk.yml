name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      # ✅ AYUSIN: SIGURADUHIN NA TAMA ANG CHECKOUT
      - name: 📥 KUNIN ANG SOURCE CODE
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1   # mas mabilis at sigurado — HINDI 0!

      - name: ✅ SURIIN — NAKUHA BA ANG SOURCE CODE?
        run: |
          echo "=== MGA FILE SA ROOT ==="
          ls -la
          echo ""
          echo "=== android/app/src/main/res/values/ ==="
          ls -la android/app/src/main/res/values/ 2>/dev/null || echo "❌ WALANG FOLDER — HINDI NABUNGA ANG SOURCE!"
          echo ""
          if [ -f "android/app/src/main/res/values/strings.xml" ]; then
            echo "✅ strings.xml — NANDYAN!"
          else
            echo "❌ strings.xml — WALA! KAYA LUMANG APK LANG!"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏷️ KUNIN ANG BERSYON
        id: version
        run: |
          VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          VERSION_NAME="${VERSION_TAG#v}"
          VERSION_CODE=$(echo "$VERSION_NAME" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }')
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: ✍️ I-UPDATE ANG BERSYON SA GRADLE
        run: |
          FILE="android/app/build.gradle.kts"
          if [ -f "$FILE" ]; then
            sed -i "s/versionCode *= *[0-9]*/versionCode = ${{ steps.version.outputs.code }}/" "$FILE"
            sed -i "s/versionName *= *\"[^\"]*\"/versionName = \"${{ steps.version.outputs.name }}\"/" "$FILE"
          fi

      - name: 🔍 TIGNAN ANG GRADLE WRAPPER
        id: check_wrapper
        run: |
          cd android
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "has_wrapper=true" >> $GITHUB_ENV
          else
            echo "has_wrapper=false" >> $GITHUB_ENV
          fi

      - name: Setup Gradle 8.2
        if: steps.check_wrapper.outputs.has_wrapper == 'false'
        run: |
          cd android
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH=/tmp/gradle-8.2/bin:$PATH
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: 🔨 BUILD ANG APK
        id: build_step
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
          EXIT_CODE=$?
          cd ..
          exit $EXIT_CODE

      - name: 📤 HANAPIN AT KOPYAHIN ANG APK
        id: find_apk
        run: |
          APK_BUILD=$(find android/app/build -name "app-debug.apk" -type f | head -1)
          
          if [ -z "$APK_BUILD" ]; then
            echo "❌ HINDI MAHANAP ANG APK!"
            exit 1
          fi
          
          echo "✅ NAKITA: $APK_BUILD"
          echo "APK_PATH=$APK_BUILD" >> $GITHUB_ENV
          
          mkdir -p docs
          NEW_APK_NAME="Martodosko-Studio-${{ steps.version.outputs.tag }}.apk"
          cp "$APK_BUILD" "docs/$NEW_APK_NAME"
          
          echo "✅ NAKOPYA SA: docs/$NEW_APK_NAME"
          echo "APK_NAME=$NEW_APK_NAME" >> $GITHUB_ENV
          ls -lh docs/

      - name: 📄 BUUIN ANG docs/failed.md
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          {
            echo "# 📋 Build Log — Martodosko Audio Studio"
            echo ""
            echo "> Created & Developed by MartoDosko © Copyright 2026"
            echo ""
            echo "---"
            echo "📅 **Petsa:** $DATE"
            echo "🏷️ **Bersyon:** ${{ steps.version.outputs.tag }}"
            echo "---"
            echo ""
            if [ -n "$APK_NAME" ]; then
              echo "✅ **TAGUMPAY — NABUO ANG BAGONG APK!**"
              echo "- 📂 Pangalan: \`$APK_NAME\`"
              echo "- 📏 Laki: $(du -h docs/$APK_NAME | cut -f1)"
            else
              echo "❌ **NABIGO — WALANG APK**"
            fi
            echo ""
            echo "✅ **Katapusan ng Talaan**"
          } > docs/failed.md

      - name: 📦 I-UPLOAD BILANG ARTIFACT
        uses: actions/upload-artifact@v4
        with:
          name: Martodosko-APK-${{ steps.version.outputs.tag }}
          path: docs/
          retention-days: 30

      # ✅ AYUSIN: HUWAG ITAGO ANG PAGKABIGO — TANGGALIN ANG || true
      - name: ✅ I-COMMIT SA docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "📦 Build: ${{ steps.version.outputs.tag }} — APK + Log"
          git push
