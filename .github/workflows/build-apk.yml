name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x ./android/gradlew

      - name: Build APK
        id: build-step
        run: |
          cd android
          ./gradlew assembleDebug 2>&1 | tee ../build-log.txt

      - name: Ipakita kung may APK ba talaga
        run: |
          echo "=== Listahan ng mga file ==="
          ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "❌ WALANG APK NABUO — bumagsak ang build!"
          echo "=== Build Log ==="
          cat build-log.txt

      - name: I-upload ang APK kung nabuo
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Martodosko-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: I-upload ang BUONG LOG kapag may problema
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BUILD-ERROR-LOG
          path: |
            build-log.txt
          if-no-files-found: warn
