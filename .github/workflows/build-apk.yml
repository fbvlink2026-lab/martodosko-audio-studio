name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏷️ KUNIN ANG BERSYON
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          fi
          VERSION_NAME="${VERSION_TAG#v}"
          VERSION_CODE=$(echo "$VERSION_NAME" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }')
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: ✍️ ISULAT SA build.gradle.kts
        run: |
          FILE="android/app/build.gradle.kts"
          if [ -f "$FILE" ]; then
            sed -i "s/versionCode *= *[0-9]*/versionCode = ${{ steps.version.outputs.code }}/" "$FILE"
            sed -i "s/versionName *= *\"[^\"]*\"/versionName = \"${{ steps.version.outputs.name }}\"/" "$FILE"
          fi

      - name: 📋 LISTAHAN NG FOLDER
        run: |
          echo "=========================================="
          echo "   📂 LAHAT NG FOLDER SA REPOSITORY"
          echo "=========================================="
          find . -maxdepth 5 -type d | grep -v '.git' | sort

      - name: 🔨 BUILD APK + BUONG LOG
        id: do_build
        run: |
          mkdir -p /tmp
          ERROR_FILE="/tmp/errors-content.txt"
          > "$ERROR_FILE"

          cd android
          chmod +x gradlew

          echo "=========================================="
          echo "🔨 TUMATAKBO ANG ./gradlew assembleDebug"
          echo "=========================================="

          # TANGGALIN ANG set -e PANSAMANTALA — PARA MAKITA ANG BUONG ERROR
          ./gradlew assembleDebug 2>&1 | tee ../build-log.txt
          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "=========================================="
          echo "📤 EXIT CODE: $EXIT_CODE"
          echo "=========================================="

          cd ..
          APK_FILE=$(find android -name "*.apk" -path "*/debug/*" 2>/dev/null | head -1)

          {
            echo "=================================================="
            echo "📦 APLIKASYON: Martodosko Audio Studio"
            echo "📂 LOKASYON:   android/app"
            echo "⏰ ORAS:       $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo "🏷️ BERSYON:    ${{ steps.version.outputs.tag }}"
            echo "📤 EXIT CODE:  $EXIT_CODE"
            echo "=================================================="
            echo ""

            if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
              APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
              echo "✅ TAGUMPAY — NABUO ANG APK!"
              echo "📂 APK Daan:   $APK_FILE"
              echo "📏 Laki:       $APK_SIZE"
              echo "📤 Kopyahin sa docs/..."
              mkdir -p "$GITHUB_WORKSPACE/docs"
              NEW_APK_NAME="Martodosko-Studio-${{ steps.version.outputs.tag }}.apk"
              cp "$APK_FILE" "$GITHUB_WORKSPACE/docs/$NEW_APK_NAME"
              echo "✅ Nasa: docs/$NEW_APK_NAME"
            else
              echo "❌ NABIGO — Hindi nabuo o hindi mahanap ang APK"
              echo "🔑 Exit Code: $EXIT_CODE"
              echo ""
              echo "📂 BUONG LISTA NG android/app/build:"
              ls -la android/app/build/ 2>/dev/null || echo "❌ Wala pang build folder"
            fi

            echo ""
            echo "--------------------------------------------------"
            echo "📋 BUONG LOG NG BUILD:"
            echo "--------------------------------------------------"
            cat build-log.txt
            echo ""
          } >> "$ERROR_FILE"

          exit $EXIT_CODE

      - name: 📄 SIGURADUHIN TAMA ANG PAGSULAT SA docs/failed.md
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          OUTPUT_FILE="$GITHUB_WORKSPACE/docs/failed.md"
          TEMP_FILE="/tmp/errors-final.md"

          {
            echo "# 📋 Build Failure Log — Martodosko Audio Studio"
            echo ""
            echo "> Created & Developed by MartoDosko © Copyright 2026"
            echo ""
            echo "---"
            echo "📅 **Petsa:** $DATE"
            echo "🏷️ **Bersyon:** ${{ steps.version.outputs.tag }}"
            echo "---"
            echo ""
            cat /tmp/errors-content.txt
            echo ""
            echo "---"
            echo "✅ **Katapusan ng Talaan**"
          } > "$TEMP_FILE"

          cp "$TEMP_FILE" "$OUTPUT_FILE"
          echo "✅ docs/failed.md naisulat na!"

      - name: 📂 HUGUTIN SA UGAT
        if: always()
        run: |
          mkdir -p /tmp/APK_ROOT
          find docs -name "*.apk" -exec cp {} /tmp/APK_ROOT/ \;
          ls -lh /tmp/APK_ROOT/

      - name: 📤 I-UPLOAD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Martodosko-APK-${{ steps.version.outputs.tag }}
          path: /tmp/APK_ROOT/
          retention-days: 30

      - name: ✅ I-COMMIT
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/failed.md docs/*.apk 2>/dev/null || true
          git commit -m "📦 Build: ${{ steps.version.outputs.tag }}" || true
          git push || true
