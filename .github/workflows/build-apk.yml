name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      # ==========================================
      # 📥 SIGURADUHING TAMA ANG SOURCE
      # ==========================================
      - name: 📥 KUNIN ANG SOURCE CODE
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: ✅ SURIIN — NANDYAN BA ANG MGA FILE SA RUNNER?
        run: |
          VALUES="app/src/main/res/values"
          echo "=== SURIIN SA RUNNER ==="
          ls -la "$VALUES/"
          echo ""
          ALL_OK=true
          for f in strings.xml colors.xml themes.xml; do
            if [ -f "$VALUES/$f" ]; then
              echo "✅ $f — NANDYAN SA RUNNER!"
            else
              echo "❌ $f — WALA SA RUNNER! HINDI TAMA ANG SOURCE!"
              ALL_OK=false
            fi
          done
          if [ "$ALL_OK" != "true" ]; then
            echo "🚨 ITIGIL — HINDI KUMPLETO ANG SOURCE SA RUNNER!"
            exit 1
          fi
          echo ""
          echo "✅ LAHAT NG KAILANGANG FILE — NANDYAN NA!"

      # ==========================================
      # ☕ JAVA
      # ==========================================
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ==========================================
      # 🛠️ SIGURADONG GRADLE 8.2 — GAYA NG HALIMBAWA
      # ==========================================
      - name: 🛠️ I-setup ang Gradle 8.2 — SIGURADONG TUGMA
        run: |
          wget https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          export PATH=/opt/gradle/gradle-8.2/bin:$PATH
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      # ==========================================
      # 🏷️ BERSYON — WALANG ERROR KAPAG WALANG TAG
      # ==========================================
      - name: 🏷️ KUNIN ANG BERSYON
        id: version
        run: |
          VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$VERSION_TAG" ]; then
            VERSION_TAG="v1.0.1-$(date +%Y%m%d%H%M)"
          fi
          VERSION_NAME="${VERSION_TAG#v}"
          VERSION_CODE=$(echo "$VERSION_NAME" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }')
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "✅ Bersyon: $VERSION_TAG"

      # ==========================================
      # ✍️ I-UPDATE ANG GRADLE
      # ==========================================
      - name: ✍️ I-UPDATE ANG BERSYON SA GRADLE
        run: |
          FILE="app/build.gradle.kts"
          if [ -f "$FILE" ]; then
            sed -i "s/versionCode *= *[0-9]*/versionCode = ${{ steps.version.outputs.code }}/" "$FILE"
            sed -i "s/versionName *= *\"[^\"]*\"/versionName = \"${{ steps.version.outputs.name }}\"/" "$FILE"
          fi

      # ==========================================
      # 🔨 BUILD — TAMA NA ANG APK_PATH SA OUTPUT
      # ==========================================
      - name: 🔨 BUILD APK
        id: build_apk
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --no-build-cache 2>&1 > build_output.txt
          
          APK_FILE=$(find app/build/outputs/apk/debug -name "app-debug.apk" -type f | head -1)
          
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "❌ HINDI MAHANAP ANG APK SA: app/build/outputs/apk/debug/"
            echo "apk_found=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "✅ NABUO ANG APK SA: $APK_FILE"
          echo "apk_found=true" >> $GITHUB_OUTPUT
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      # ==========================================
      # 📤 KOPYAHIN SA docs/ — ✅ TINAWAG MULA SA OUTPUT
      # ==========================================
      - name: 📤 KOPYAHIN SA docs/
        if: steps.build_apk.outputs.apk_found == 'true'
        run: |
          mkdir -p docs
          APK_PATH="${{ steps.build_apk.outputs.apk_path }}"
          NEW_APK="Martodosko-Studio-${{ steps.version.outputs.tag }}.apk"
          
          echo "📤 KOPYAHIN MULA: $APK_PATH"
          cp "$APK_PATH" "docs/$NEW_APK"
          
          file "docs/$NEW_APK"
          echo "✅ NAKOPYA: docs/$NEW_APK"
          echo "apk_name=$NEW_APK" >> $GITHUB_ENV

      # ==========================================
      # 📄 ISULAT SA docs/failed.md — KUNG MAY ERROR
      # ==========================================
      - name: 📄 ISULAT SA docs/failed.md — KUNG NABIGO
        if: failure()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          mkdir -p docs
          {
            echo "# ❌ BUILD ERROR — Martodosko Audio Studio"
            echo ""
            echo "> Created & Developed by MartoDosko © Copyright 2026"
            echo ""
            echo "---"
            echo "📅 **Petsa:** $DATE"
            echo "🏷️ **Bersyon:** ${{ steps.version.outputs.tag }}"
            echo "---"
            echo ""
            echo "## 🚨 MGA ERROR:"
            echo "\`\`\`"
            grep -E "^e:|error:|FAILED|Exception|Error" build_output.txt | head -25
            echo "\`\`\`"
          } > docs/failed.md
          echo "✅ NAISULAT SA docs/failed.md"

      - name: ✅ ISULAT SA docs/failed.md — KUNG MATAGUMPAY
        if: success() && steps.build_apk.outputs.apk_found == 'true'
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          mkdir -p docs
          APK_NAME="Martodosko-Studio-${{ steps.version.outputs.tag }}.apk"
          {
            echo "# ✅ BUILD SUCCESS — Martodosko Audio Studio"
            echo ""
            echo "> Created & Developed by MartoDosko © Copyright 2026"
            echo ""
            echo "---"
            echo "📅 **Petsa:** $DATE"
            echo "🏷️ **Bersyon:** ${{ steps.version.outputs.tag }}"
            echo "---"
            echo ""
            echo "✅ **MATAGUMPAY — BAGONG APK NABUO!**"
            echo "- 📂 Pangalan: \`$APK_NAME\`"
            echo "- 📂 Lokasyon: app/build/outputs/apk/debug/"
            echo "- ✅ strings.xml — NANDYAN SA RUNNER"
            echo "- ✅ colors.xml — NANDYAN SA RUNNER"
            echo "- ✅ themes.xml — NANDYAN SA RUNNER"
            echo ""
            echo "✅ **Katapusan ng Talaan**"
          } > docs/failed.md
          echo "✅ NAISULAT SA docs/failed.md"

      # ==========================================
      # 📦 I-UPLOAD ARTIFACT
      # ==========================================
      - name: 📦 I-UPLOAD ARTIFACT
        if: steps.build_apk.outputs.apk_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Martodosko-APK-${{ steps.version.outputs.tag }}
          path: docs/Martodosko-Studio-${{ steps.version.outputs.tag }}.apk
          retention-days: 30

      # ==========================================
      # ✅ I-COMMIT docs/
      # ==========================================
      - name: ✅ I-COMMIT docs/ SA GITHUB
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git pull origin main --rebase 2>/dev/null || true
          git commit -m "📦 Build: ${{ steps.version.outputs.tag }} — APK + Log" || true
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/fbvlink2026-lab/martodosko-audio-studio.git HEAD:main || true
