name: Build APK
on:
  push: { branches: [main] }
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x ./android/gradlew

      - name: Build APK
        id: build-step
        run: |
          cd android
          ./gradlew assembleDebug 2>&1 | tee ../build-log.txt
        continue-on-error: true

      # === KAPAG BUMAGSAK — AWTO-UPDATE ANG docs/failed.md ===
      - name: Log Failure to docs/failed.md
        if: steps.build-step.outcome == 'failure'
        run: |
          cd $GITHUB_WORKSPACE
          cat > docs/failed.md <<MDEND
# 📋 Build Failure Log — Martodosko Audio Studio

> AWTO GENERATED — Huling na-update: $(date '+%Y-%m-%d %H:%M:%S UTC')

---

## ❌ Huling Pagkabigo
**Petsa:** $(date '+%Y-%m-%d')
**Workflow Run:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

### Buong Error Log:
\`\`\`
$(cat build-log.txt)
\`\`\`

---

## 📋 Kasaysayan ng Pagkabigo at Pag-aayos

### ❌ Error 1 — Missing Gradle Wrapper JAR
**Sanhi:** Kulang ang \`gradle-wrapper.jar\` — kailangan para mapatakbo ang Gradle
**Solusyon:** Idinagdag ang totoong jar file

### ❌ Error 2 — No repositories defined
**Sanhi:** Walang \`google()\` at \`mavenCentral()\` sa settings.gradle.kts
**Solusyon:** Idinagdag ang repositories block

> ⚠️ Tingnan sa itaas ang **BUONG LOG** ng kasalukuyang pagkabigo — awto-update ito!
MDEND

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/failed.md
          git commit -m "📝 AWTO-LOG: Naitala ang pagkabigo sa build" || true
          git push || true

      - name: Fail the job kung bumagsak
        if: steps.build-step.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        if: steps.build-step.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Martodosko-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
