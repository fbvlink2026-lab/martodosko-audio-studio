name: Build Martodosko APK

on:
  # ❌ TINANGGAL — hindi na kusang tatakbo kapag nag-push
  # push:
  #   branches: [ main, master ]
  
  # ✅ ITO LANG — kapag PININDOT MO LANG sa Actions tab
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.statistics.enabled=false
      GRADLE_VERSION: "8.2"
    steps:
      - uses: actions/checkout@v4

      - name: ☕ Ihanda ang Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📋 LISTAHAN NG FOLDER
        run: |
          echo "=========================================="
          echo "   📂 LAHAT NG FOLDER SA REPOSITORY"
          echo "=========================================="
          find . -maxdepth 5 -type d | grep -v '.git' | sort

      - name: 🛠️ I-setup ang Gradle 8.2
        run: |
          if [ -d "/opt/gradle/gradle-${{ env.GRADLE_VERSION }}" ] && [ -x "/opt/gradle/gradle-${{ env.GRADLE_VERSION }}/bin/gradle" ]; then
              echo "✅ Gradle ${{ env.GRADLE_VERSION }} NASA LUGAR NA"
              export PATH=/opt/gradle/gradle-${{ env.GRADLE_VERSION }}/bin:$PATH
          else
              echo "📥 I-download ang Gradle ${{ env.GRADLE_VERSION }}..."
              wget -q https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip -O /tmp/gradle.zip
              unzip -q /tmp/gradle.zip -d /opt/gradle
              export PATH=/opt/gradle/gradle-${{ env.GRADLE_VERSION }}/bin:$PATH
              rm /tmp/gradle.zip
              echo "✅ Gradle ${{ env.GRADLE_VERSION }} NAKAINSTALL NA!"
          fi
          
          if [ ! -f "./gradlew" ]; then
              gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
              chmod +x gradlew
              echo "✅ Gradle Wrapper NABUO NA"
          else
              chmod +x gradlew
              echo "✅ Gradle Wrapper NASA LUGAR NA"
          fi

      # ==================================================
      # 🏷️ KUNIN AT TAASIN ANG BERSYON
      # ==================================================
      - name: 🏷️ Bumuo ng Bersyon — AWTOMATIKONG TUMAAS
        id: version
        run: |
          mkdir -p docs
          
          if [ -f docs/version.json ]; then
              CURRENT_VER=$(grep -o '"version":"[^"]*"' docs/version.json | head -1 | cut -d'"' -f4)
              echo "📖 Kasalukuyang Bersyon: v$CURRENT_VER"
              
              VERSION_MAJOR=$(echo "$CURRENT_VER" | cut -d. -f1)
              VERSION_MINOR=$(echo "$CURRENT_VER" | cut -d. -f2)
              VERSION_PATCH=$(echo "$CURRENT_VER" | cut -d. -f3)
          else
              echo "🆕 Walang nakitang version.json — Magsisimula sa v1.0.1"
              VERSION_MAJOR=1
              VERSION_MINOR=0
              VERSION_PATCH=0
          fi
          
          VERSION_PATCH=$((VERSION_PATCH + 1))
          VERSION_NAME="$VERSION_MAJOR.$VERSION_MINOR.$VERSION_PATCH"
          VERSION_CODE=$((VERSION_MAJOR * 10000 + VERSION_MINOR * 100 + VERSION_PATCH))
          APK_FILENAME="Martodosko-Studio-v$VERSION_NAME.apk"
          
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "apk_filename=$APK_FILENAME" >> $GITHUB_OUTPUT
          
          echo "{\"version\":\"$VERSION_NAME\",\"apkFile\":\"$APK_FILENAME\",\"released\":\"$(date +%Y-%m-%d)\"}" > docs/version.json
          echo "✅ Bagong Bersyon: v$VERSION_NAME  (Code: $VERSION_CODE)"
          cat docs/version.json

      # ==================================================
      # ✅ I-UPDATE ANG build.gradle.kts — KUSANG PALITAN
      # ==================================================
      - name: ✅ Isulat ang bagong bersyon sa build.gradle.kts
        run: |
          VERSION_NAME="${{ steps.version.outputs.name }}"
          VERSION_CODE="${{ steps.version.outputs.code }}"
          
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $VERSION_CODE/" app/build.gradle.kts
          
          echo "✅ Na-update: versionName=$VERSION_NAME, versionCode=$VERSION_CODE"
          grep "versionName\|versionCode" app/build.gradle.kts

      # ==================================================
      # 📦 BUUIN ANG APK
      # ==================================================
      - name: 📦 Bumuo ng APK
        id: build-step
        run: |
          mkdir -p /tmp
          ERROR_FILE="/tmp/build-report-content.txt"
          > "$ERROR_FILE"
          LOG_FILE="/tmp/martodosko-build-full.log"

          echo "📦 BUMUO NG APK — Martodosko Studio"
          cd "$GITHUB_WORKSPACE"

          set +e
          ./gradlew clean assembleDebug --no-daemon --no-build-cache > "$LOG_FILE" 2>&1
          EXIT_CODE=$?
          set -e

          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)

          {
            echo "=================================================="
            echo "📦 APLIKASYON: Martodosko Audio Studio"
            echo "📂 LOKASYON:   app/build/outputs/apk/debug"
            echo "⏰ ORAS:       $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo "🏷️ BERSYON:    v${{ steps.version.outputs.name }}"
            echo "=================================================="
            echo ""

            if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
              APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
              echo "✅ TAGUMPAY — NABUO ANG APK!"
              echo "📂 APK Daan:   $APK_FILE"
              echo "📏 Laki:       $APK_SIZE"
              echo "📤 Kopyahin sa docs/..."
              mkdir -p docs
              cp "$APK_FILE" "docs/${{ steps.version.outputs.apk_filename }}"
              echo "✅ Nasa: docs/${{ steps.version.outputs.apk_filename }}"
            else
              echo "❌ NABIGO — Hindi nabuo o hindi mahanap ang APK"
              echo "🔑 Exit Code: $EXIT_CODE"
            fi

            echo ""
            echo "--------------------------------------------------"
            echo "📋 BUONG LOG NG BUILD:"
            echo "--------------------------------------------------"
            cat "$LOG_FILE"
            echo ""
            echo "=================================================="
          } >> "$ERROR_FILE"

          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_OUTPUT

      # ==================================================
      # 📄 BUILD REPORT
      # ==================================================
      - name: 📄 Isulat ang build-report.md
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          OUTPUT_FILE="$GITHUB_WORKSPACE/docs/build-report.md"
          TEMP_FILE="/tmp/build-report-final.md"

          mkdir -p docs

          {
            echo "# 📋 Build Report — Martodosko Audio Studio"
            echo ""
            echo "> Created & Developed by MartoDosko © Copyright 2026"
            echo ""
            echo "---"
            echo "📅 **Petsa:** $DATE"
            echo "🏷️ **Bersyon:** v${{ steps.version.outputs.name }}"
            echo "---"
            echo ""
            cat /tmp/build-report-content.txt
            echo ""
            echo "---"
            echo "✅ **Katapusan ng Talaan**"
          } > "$TEMP_FILE"

          cp "$TEMP_FILE" "$OUTPUT_FILE"
          echo "✅ build-report.md naisulat na!"

      # ==================================================
      # ✅ I-COMMIT AT I-PUSH
      # ==================================================
      - name: ✅ I-commit at i-push ang mga pagbabago
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin main
          git pull --no-rebase -X theirs --allow-unrelated-histories origin/main || true
          
          git add docs/version.json docs/build-report.md docs/*.apk app/build.gradle.kts 2>/dev/null || true
          
          git commit -m "🏷️ Build v${{ steps.version.outputs.name }}" --allow-empty || true
          
          git push origin main || echo "⚠️ Hindi maipush — pero nasa docs/ na sa runner!"
