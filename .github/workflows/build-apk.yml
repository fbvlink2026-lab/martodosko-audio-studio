name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      # ==========================================
      # 📥 SIGURADUHIN NA TAMA ANG SOURCE CODE
      # ==========================================
      - name: 📥 KUNIN ANG PINAKABAGONG SOURCE CODE
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # Kumpletong history — siguradong tama
          clean: true       # Linisin muna — walang lumang file na natira

      - name: ✅ SURIIN — NANDYAN BA ANG MGA BAGONG FILE?
        run: |
          echo "=== 📂 Root ==="
          ls -la
          echo ""
          echo "=== 📂 android/app/src/main/res/values/ ==="
          VALUES_DIR="android/app/src/main/res/values"
          if [ ! -d "$VALUES_DIR" ]; then
            echo "❌ WALANG values folder — MALING SOURCE!"
            exit 1
          fi
          
          # ✅ TIGNAN ANG LAHAT NG KAILANGANG FILE
          ALL_OK=true
          for f in strings.xml colors.xml styles.xml; do
            if [ -f "$VALUES_DIR/$f" ]; then
              echo "✅ $f — NANDYAN"
            else
              echo "❌ $f — WALA! KAYA HINDI BAGONG SOURCE ITO!"
              ALL_OK=false
            fi
          done
          
          if [ "$ALL_OK" != "true" ]; then
            echo ""
            echo "🚨 HINDI TAMA ANG SOURCE CODE — ITIGIL DITO!"
            echo "   Hindi pa naipush ang mga bagong file o mali ang checkout."
            exit 1
          fi
          echo ""
          echo "✅ LAHAT NG KAILANGANG FILE — NANDYAN NA! BAGONG BUILD ITO!"

      # ==========================================
      # ☕ JAVA
      # ==========================================
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ==========================================
      # 🏷️ BERSYON
      # ==========================================
      - name: 🏷️ KUNIN ANG BERSYON
        id: version
        run: |
          VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          VERSION_NAME="${VERSION_TAG#v}"
          VERSION_CODE=$(echo "$VERSION_NAME" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }')
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "✅ Bersyon: $VERSION_TAG"

      # ==========================================
      # 🔧 GRADLE SETUP
      # ==========================================
      - name: 🔍 TIGNAN ANG GRADLE WRAPPER
        id: check_wrapper
        run: |
          cd android
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "has_wrapper=true" >> $GITHUB_ENV
          else
            echo "has_wrapper=false" >> $GITHUB_ENV
          fi

      - name: Setup Gradle 8.2
        if: steps.check_wrapper.outputs.has_wrapper == 'false'
        run: |
          cd android
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH=/tmp/gradle-8.2/bin:$PATH
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      # ==========================================
      # 🔨 BUILD APK — KUNG MAY MALI → ITIGIL AGAD
      # ==========================================
      - name: 🔨 BUILD ANG APK
        id: build_apk
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew clean assembleDebug   # ✅ "clean" → TANGGALIN ANG LUMANG BUILD!
          echo "BUILD_EXIT=0" >> $GITHUB_ENV

      # ==========================================
      # 📤 HANAPIN AT KOPYAHIN — TIGNAN KUNG TALAGANG BAGO
      # ==========================================
      - name: 📤 HANAPIN AT KOPYAHIN ANG APK
        id: copy_apk
        run: |
          # ✅ HANAPIN — SAAN MAN
          APK_BUILD=$(find android/app/build -name "app-debug.apk" -type f | head -1)
          
          if [ -z "$APK_BUILD" ] || [ ! -f "$APK_BUILD" ]; then
            echo "❌ HINDI MAHANAP ANG APK — WALANG NABUO!"
            exit 1
          fi
          
          echo "✅ NAKITA ANG APK SA: $APK_BUILD"
          
          # ✅ KUMPARE SA LUMANG APK — PAREHO BA?
          mkdir -p docs
          NEW_NAME="Martodosko-Studio-${{ steps.version.outputs.tag }}.apk"
          TARGET="docs/$NEW_NAME"
          
          if [ -f "$TARGET" ]; then
            OLD_HASH=$(sha256sum "$TARGET" | awk '{print $1}')
            NEW_HASH=$(sha256sum "$APK_BUILD" | awk '{print $1}')
            if [ "$OLD_HASH" = "$NEW_HASH" ]; then
              echo "⚠️  PAREHO ANG LAMAN — HINDI BAGO ANG BUILD!"
            else
              echo "✅ BAGONG APK — IBA ANG LAMAN!"
            fi
          fi
          
          cp "$APK_BUILD" "$TARGET"
          echo "✅ NAKOPYA → $TARGET"
          
          ls -lh docs/
          
          echo "APK_NAME=$NEW_NAME" >> $GITHUB_ENV
          echo "APK_PATH=$TARGET" >> $GITHUB_ENV

      # ==========================================
      # 📄 BUUIN ANG LOG
      # ==========================================
      - name: 📄 ISULAT SA docs/failed.md
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          {
            echo "# 📋 Build Log — Martodosko Audio Studio"
            echo ""
            echo "> Created & Developed by MartoDosko © Copyright 2026"
            echo ""
            echo "---"
            echo "📅 **Petsa:** $DATE"
            echo "🏷️ **Bersyon:** ${{ steps.version.outputs.tag }}"
            echo "---"
            echo ""
            echo "✅ **TAGUMPAY — BAGONG APK NABUO!**"
            echo "- 📂 Pangalan: \`${{ env.APK_NAME }}\`"
            echo "- 📏 Laki: $(du -h ${{ env.APK_PATH }} | cut -f1)"
            echo ""
            echo "✅ **Katapusan ng Talaan**"
          } > docs/failed.md

      # ==========================================
      # 📦 I-UPLOAD
      # ==========================================
      - name: 📦 I-UPLOAD BILANG ARTIFACT
        uses: actions/upload-artifact@v4
        with:
          name: Martodosko-APK-${{ steps.version.outputs.tag }}
          path: docs/
          retention-days: 30

      # ==========================================
      # ✅ I-COMMIT — KUNG MAY MALI → HINDI ITAGO
      # ==========================================
      - name: ✅ I-COMMIT docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          
          if git diff --staged --quiet; then
            echo "ℹ️ Walang pagbabago sa docs/"
          else
            git commit -m "📦 Build: ${{ steps.version.outputs.tag }} — APK + Log"
            git push   # ❌ TINANGAL ANG || true — KUNG MAY MALI → SABIHIN AGAD!
            echo "✅ NAI-COMMIT SA docs/"
          fi
