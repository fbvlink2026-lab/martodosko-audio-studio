name: Build APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏷️ KUNIN ANG BERSYON
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          fi
          VERSION_NAME="${VERSION_TAG#v}"
          VERSION_CODE=$(echo "$VERSION_NAME" | awk -F. '{ printf "%d%02d%02d", \$1, \$2, \$3 }')
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: ✍️ ISULAT SA build.gradle.kts
        run: |
          FILE="android/app/build.gradle.kts"
          if [ -f "$FILE" ]; then
            sed -i "s/versionCode *= *[0-9]*/versionCode = ${{ steps.version.outputs.code }}/" "$FILE"
            sed -i "s/versionName *= *\"[^\"]*\"/versionName = \"${{ steps.version.outputs.name }}\"/" "$FILE"
          fi

      - name: 🔨 BUILD APK
        id: do_build
        run: |
          mkdir -p /tmp
          ERROR_FILE="/tmp/errors-content.txt"
          > "$ERROR_FILE"

          cd android
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug 2>&1 | tee ../build-log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          cd ..

          # ✅ HANAPIN ANG APK — SA LAHAT NG POSIBLENG LUGAR
          APK_FILE=$(find android -name "*.apk" 2>/dev/null | grep -i debug | head -1)

          {
            echo "=================================================="
            echo "📦 APLIKASYON: Martodosko Audio Studio"
            echo "📂 LOKASYON:   android/app"
            echo "⏰ ORAS:       $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo "🏷️ BERSYON:    ${{ steps.version.outputs.tag }}"
            echo "📤 EXIT CODE:  $EXIT_CODE"
            echo "=================================================="
            echo ""

            if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
              APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
              echo "✅ TAGUMPAY — NABUO ANG APK!"
              echo "📂 APK Daan:   $APK_FILE"
              echo "📏 Laki:       $APK_SIZE"

              # ✅ SIGURADUHIN MAY docs/ FOLDER
              mkdir -p docs
              NEW_APK_NAME="Martodosko-Studio-${{ steps.version.outputs.tag }}.apk"
              DEST_PATH="docs/$NEW_APK_NAME"

              cp "$APK_FILE" "$DEST_PATH"
              echo "✅ NAKOPYA SA: $DEST_PATH"

              # ✅ LIKHA NG version.json — para sa Auto-Update
              cat > docs/version.json <<JSON
{
  "versionTag": "${{ steps.version.outputs.tag }}",
  "versionName": "${{ steps.version.outputs.name }}",
  "versionCode": ${{ steps.version.outputs.code }},
  "apkName": "$NEW_APK_NAME",
  "builtAt": "$(date -Iseconds)"
}
JSON
              echo "✅ Nalikha: docs/version.json"
            else
              echo "❌ NABIGO — Hindi mahanap ang APK"
              echo "🔑 Exit Code: $EXIT_CODE"
              echo ""
              echo "📂 Lahat ng APK na nakita:"
              find android -name "*.apk" 2>/dev/null || echo "Wala"
            fi

            echo ""
            echo "--------------------------------------------------"
            echo "📋 BUONG LOG NG BUILD:"
            echo "--------------------------------------------------"
            cat build-log.txt
            echo ""
          } >> "$ERROR_FILE"

          exit $EXIT_CODE

      - name: 📄 ISULAT SA docs/failed.md
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          mkdir -p docs
          OUTPUT_FILE="docs/failed.md"
          {
            echo "# 📋 Build Log — Martodosko Audio Studio"
            echo ""
            echo "> Created & Developed by MartoDosko © Copyright 2026"
            echo ""
            echo "---"
            echo "📅 **Petsa:** $DATE"
            echo "🏷️ **Bersyon:** ${{ steps.version.outputs.tag }}"
            echo "---"
            echo ""
            cat /tmp/errors-content.txt
            echo ""
            echo "---"
            echo "✅ **Katapusan**"
          } > "$OUTPUT_FILE"
          echo "✅ Naisulat sa: $OUTPUT_FILE"

      - name: 📤 I-UPLOAD BILANG ARTIFACT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Martodosko-APK-${{ steps.version.outputs.tag }}
          path: |
            docs/*.apk
            docs/version.json
            docs/failed.md
          retention-days: 30

      - name: ✅ I-COMMIT ANG docs/ FOLDER SA GITHUB
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ✅ Siguraduhin na tanging docs/ lang ang ia-add
          git add docs/

          # ✅ I-commit — walang error kung walang pagbabago
          git commit -m "📦 Build Output: ${{ steps.version.outputs.tag }}" || true

          # ✅ I-push — handa nang mabasa ng Auto-Update ng app
          git push || true
