name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏷️ KUNIN ANG BERSYON — AWTO BAWAT BUILD
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          fi
          VERSION_NAME="${VERSION_TAG#v}"
          VERSION_CODE=$(echo "$VERSION_NAME" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }')
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: ✍️ ISULAT SA build.gradle.kts
        run: |
          FILE="android/app/build.gradle.kts"
          CODE="${{ steps.version.outputs.code }}"
          NAME="${{ steps.version.outputs.name }}"
          sed -i "s/versionCode *= *[0-9]*/versionCode = $CODE/" "$FILE"
          sed -i "s/versionName *= *\"[^\"]*\"/versionName = \"$NAME\"/" "$FILE"
          grep -E "versionCode|versionName" "$FILE"

      - name: 🔨 BUILD APK
        id: do_build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1
          cd ..

      - name: 📂 HANAPIN KUNG SAAN TALAGA ANG APK
        run: |
          echo "=== HINAHANAP ANG APK ==="
          find . -name "*.apk" 2>/dev/null
          echo ""
          echo "=== BUONG LISTA NG build FOLDER ==="
          find android -name "build" -type d 2>/dev/null
          echo ""
          echo "=== Ano ang laman ng android/app/build/outputs/ ==="
          ls -la android/app/build/outputs/ 2>/dev/null || echo "❌ Wala — ibang daan ginamit"

      - name: 📤 IKOPYA ANG APK — KAHIT SAAN MAN ITO
        id: find_apk
        run: |
          mkdir -p docs
          APK_FILE=$(find . -name "*debug*.apk" 2>/dev/null | head -1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "✅ NAKITA ANG APK SA: $APK_FILE"
            APK_NAME="Martodosko-Studio-${{ steps.version.outputs.tag }}.apk"
            cp "$APK_FILE" "docs/$APK_NAME"
            echo "apk_path=docs/$APK_NAME" >> $GITHUB_OUTPUT
            echo "✅ NAKOPYA SA: docs/$APK_NAME"
          else
            echo "❌ WALANG APK NA NABUO KAHIT SAAN"
            exit 1
          fi

      - name: 📄 ISULAT SA docs/failed.md
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          OUTPUT_FILE="$GITHUB_WORKSPACE/docs/failed.md"

          {
            echo "# 📋 Build Log — Martodosko Audio Studio"
            echo ""
            echo "> Created & Developed by MartoDosko © Copyright 2026"
            echo ""
            echo "---"
            echo "📅 **Petsa:** $DATE"
            echo "🏷️ **Bersyon:** ${{ steps.version.outputs.tag }}"
            echo "---"
            echo ""
            if [ -n "${{ steps.find_apk.outputs.apk_path }}" ]; then
              echo "✅ **TAGUMPAY — NABUO ANG APK!**"
              echo "- 📂 Daan: ${{ steps.find_apk.outputs.apk_path }}"
            else
              echo "❌ **Hindi mahanap ang APK**"
            fi
            echo ""
          } > "$OUTPUT_FILE"

      - name: 📤 I-UPLOAD ANG APK
        if: steps.find_apk.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: Martodosko-Studio-APK-${{ steps.version.outputs.tag }}
          path: docs/
          retention-days: 30
