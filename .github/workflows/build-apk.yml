name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      # ==========================================
      # 📥 SIGURADUHING TAMA ANG SOURCE
      # ==========================================
      - name: 📥 KUNIN ANG SOURCE CODE
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      - name: ✅ SURIIN — NANDYAN BA ANG MGA FILE SA RUNNER?
        run: |
          VALUES="app/src/main/res/values"
          echo "=== SURIIN SA RUNNER ==="
          ls -la "$VALUES/"
          echo ""
          ALL_OK=true
          for f in strings.xml colors.xml themes.xml; do
            if [ -f "$VALUES/$f" ]; then
              echo "✅ $f — NANDYAN SA RUNNER!"
            else
              echo "❌ $f — WALA SA RUNNER! HINDI TAMA ANG SOURCE!"
              ALL_OK=false
            fi
          done
          if [ "$ALL_OK" != "true" ]; then
            echo "🚨 ITIGIL — HINDI KUMPLETO ANG SOURCE SA RUNNER!"
            exit 1
          fi

      # ==========================================
      # ☕ JAVA
      # ==========================================
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ==========================================
      # 🏷️ BERSYON — KUNG WALANG TAG → GUMAMIT NG DATE
      # ==========================================
      - name: 🏷️ KUNIN ANG BERSYON
        id: version
        run: |
          VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
          if [ -z "$VERSION_TAG" ]; then
            VERSION_TAG="v1.0.1-$(date +%Y%m%d%H%M)"
          fi
          VERSION_NAME="${VERSION_TAG#v}"
          VERSION_CODE=$(echo "$VERSION_NAME" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }')
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "✅ Bersyon: $VERSION_TAG"

      # ==========================================
      # ✍️ I-UPDATE ANG GRADLE
      # ==========================================
      - name: ✍️ I-UPDATE ANG BERSYON SA GRADLE
        run: |
          FILE="app/build.gradle.kts"
          if [ -f "$FILE" ]; then
            sed -i "s/versionCode *= *[0-9]*/versionCode = ${{ steps.version.outputs.code }}/" "$FILE"
            sed -i "s/versionName *= *\"[^\"]*\"/versionName = \"${{ steps.version.outputs.name }}\"/" "$FILE"
          fi

      # ==========================================
      # 🔨 BUILD — TAMA NA ANG DAAN
      # ==========================================
      - name: 🔨 BUILD APK
        id: build_apk
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug
          
          # ✅ TAMA NA ANG DAAN — app/build/ HINDI android/app/build/
          APK_FILE=$(find app/build/outputs/apk/debug -name "app-debug.apk" -type f | head -1)
          
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "❌ HINDI MAHANAP ANG APK SA: app/build/outputs/apk/debug/"
            echo "apk_found=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "✅ NABUO ANG APK SA: $APK_FILE"
          echo "apk_found=true" >> $GITHUB_OUTPUT
          echo "apk_path=$APK_FILE" >> $GITHUB_ENV

      # ==========================================
      # 📤 KOPYAHIN SA docs/ — TOTOONG APK HINDI ZIP
      # ==========================================
      - name: 📤 KOPYAHIN SA docs/
        if: env.apk_found == 'true'
        run: |
          mkdir -p docs
          NEW_APK="Martodosko-Studio-${{ steps.version.outputs.tag }}.apk"
          cp "$APK_PATH" "docs/$NEW_APK"
          
          # ✅ SURIIN — TOTOONG APK BA?
          file "docs/$NEW_APK"
          echo "✅ NAKOPYA: docs/$NEW_APK"
          echo "apk_name=$NEW_APK" >> $GITHUB_ENV

      # ==========================================
      # 📄 BUUIN ANG LOG
      # ==========================================
      - name: 📄 ISULAT SA docs/failed.md
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          {
            echo "# 📋 Build Log — Martodosko Audio Studio"
            echo ""
            echo "> Created & Developed by MartoDosko © Copyright 2026"
            echo ""
            echo "---"
            echo "📅 **Petsa:** $DATE"
            echo "🏷️ **Bersyon:** ${{ steps.version.outputs.tag }}"
            echo "---"
            echo ""
            if [ "${{ env.apk_found }}" = "true" ]; then
              echo "✅ **TAGUMPAY — BAGONG APK NABUO!**"
              echo "- 📂 Pangalan: \`$APK_NAME\`"
              echo "- 📂 Lokasyon: app/"
              echo "- ✅ strings.xml — NANDYAN SA RUNNER"
              echo "- ✅ colors.xml — NANDYAN SA RUNNER"
              echo "- ✅ themes.xml — NANDYAN SA RUNNER"
            else
              echo "❌ **NABIGO — WALANG APK**"
            fi
            echo ""
            echo "✅ **Katapusan ng Talaan**"
          } > docs/failed.md

      # ==========================================
      # 📦 I-UPLOAD ARTIFACT
      # ==========================================
      - name: 📦 I-UPLOAD
        if: env.apk_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Martodosko-APK-${{ steps.version.outputs.tag }}
          path: docs/
          retention-days: 30

      # ==========================================
      # ✅ I-COMMIT docs/ — AYUSIN ANG REJECT
      # ==========================================
      - name: ✅ I-COMMIT docs/
        if: env.apk_found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git pull origin main --rebase
          git commit -m "📦 Build: ${{ steps.version.outputs.tag }}"
          git push
