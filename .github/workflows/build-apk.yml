# ==================================================
# FILE: build-apk.yml
# VERSION: 2.1.0 — SECURE & PERSISTENT SIGNING
# UPDATED: 2026-10-11
# PURPOSE: Build Signed Release APK using GitHub Secrets
# AUTHOR: Martodosko Studio
# ==================================================

name: 🚀 Build Martodosko Release APK

on:
  workflow_dispatch: # Manual trigger only for now

jobs:
  build-release:
    name: 📦 Compile & Sign Release APK
    runs-on: ubuntu-latest
    
    # ✅ LEAST PRIVILEGE: Only need write access to push artifacts/docs
    permissions:
      contents: write 

    steps:
      - name: 🛒 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper # Uses the project's defined wrapper version

      # ==================================================
      # 🔑 STEP 1: RESTORE PERSISTENT KEYSTORE FROM SECRETS
      # ==================================================
      - name: 🔓 Decrypt & Restore Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "🔓 Restoring persistent signing key..."
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ ERROR: RELEASE_KEYSTORE_BASE64 secret is missing!"
            exit 1
          fi
          
          # Decode base64 string back to binary .keystore file
          echo "$KEYSTORE_BASE64" | base64 --decode > app/martodosko-release.keystore
          
          # Verify file exists and has size
          if [ ! -s app/martodosko-release.keystore ]; then
             echo "❌ ERROR: Decoded keystore is empty or corrupt."
             exit 1
          fi
          echo "✅ Keystore restored successfully."

      # ==================================================
      # 🏷️ STEP 2: AUTOMATIC VERSION BUMPING
      # ==================================================
      - name: 🏷️ Calculate Next Version
        id: version
        run: |
          mkdir -p docs
          
          if [ -f docs/version.json ]; then
              CURRENT_VER=$(grep -o '"version":"[^"]*"' docs/version.json | head -1 | cut -d'"' -f4)
              echo "📖 Current: v$CURRENT_VER"
              
              VERSION_MAJOR=$(echo "$CURRENT_VER" | cut -d. -f1)
              VERSION_MINOR=$(echo "$CURRENT_VER" | cut -d. -f2)
              VERSION_PATCH=$(echo "$CURRENT_VER" | cut -d. -f3)
          else
              echo "🆕 Starting fresh at v1.0.0"
              VERSION_MAJOR=1; VERSION_MINOR=0; VERSION_PATCH=0
          fi
          
          VERSION_PATCH=$((VERSION_PATCH + 1))
          VERSION_NAME="$VERSION_MAJOR.$VERSION_MINOR.$VERSION_PATCH"
          VERSION_CODE=$((VERSION_MAJOR * 10000 + VERSION_MINOR * 100 + VERSION_PATCH))
          APK_FILENAME="Martodosko-Studio-v$VERSION_NAME.apk"
          
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "filename=$APK_FILENAME" >> $GITHUB_OUTPUT
          
          # Update local version.json immediately for consistency
          echo "{\"version\":\"$VERSION_NAME\",\"apkFile\":\"$APK_FILENAME\",\"released\":\"$(date +%Y-%m-%d)\"}" > docs/version.json
          echo "✅ New Version: v$VERSION_NAME (Code: $VERSION_CODE)"

      - name: ✍️ Inject Version into Build Config
        run: |
          VERSION_NAME="${{ steps.version.outputs.name }}"
          VERSION_CODE="${{ steps.version.outputs.code }}"
          
          # Update app/build.gradle.kts dynamically
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $VERSION_CODE/" app/build.gradle.kts
          
          echo "✅ Updated build.gradle.kts to v$VERSION_NAME"

      # ==================================================
      # 📦 STEP 3: BUILD THE APK WITH SECURE ENV VARS
      # ==================================================
      - name: 🛠️ Assemble Release APK
        env:
          # ✅ PASS SUPABASE SECRETS TO GRADLE
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          
          # ✅ PASS SIGNING SECRETS TO GRADLE
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          echo "🚀 Starting Release Build..."
          # Clean build to ensure no cache issues
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      # ==================================================
      # 📤 STEP 4: ARTIFACT HANDLING & REPORTING
      # ==================================================
      - name: 📂 Locate Generated APK
        id: locate
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ ERROR: No APK found in release folder!"
            exit 1
          fi
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "size=$(du -h "$APK_PATH" | cut -f1)" >> $GITHUB_OUTPUT
          echo "✅ Found APK: $APK_PATH (${{ steps.locate.outputs.size }})"

      - name: 📝 Generate Build Report
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          VERSION="${{ steps.version.outputs.name }}"
          STATUS="SUCCESS"
          if [ "${{ job.status }}" != "success" ]; then STATUS="FAILED"; fi
          
          cat <<EOF > docs/build-report.md
          # 📋 Build Report — Martodosko Audio Studio
          
          > Created by CI/CD Pipeline © Copyright 2026
          
          ---
          📅 **Date:** $DATE
          🏷️ **Version:** v$VERSION
          🔑 **Signing:** Persistent Key (Restored from Secret)
          📊 **Status:** $STATUS
          ---
          
          ### 📦 Artifacts
          - **APK Location:** \`app/build/outputs/apk/release/\`
          - **Filename:** \`${{ steps.version.outputs.filename }}\`
          
          ### ⚙️ Configuration Used
          - **Java:** 17 (Temurin)
          - **Gradle:** Wrapper Default
          - **Supabase URL:** Injected via Secrets
          EOF
          
          echo "✅ Build report generated."

      - name: 💾 Commit Updates to Repo
        if: success()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add updated files
          git add docs/version.json docs/build-report.md app/build.gradle.kts
          
          # Try to copy APK to docs for direct download link (optional, increases repo size)
          # cp ${{ steps.locate.outputs.path }} docs/${{ steps.version.outputs.filename }}
          # git add docs/${{ steps.version.outputs.filename }}
          
          git commit -m "🤖 Auto-Build v${{ steps.version.outputs.name }} — Secure Release" || echo "No changes to commit"
          git push origin main || echo "⚠️ Push failed (maybe protected branch)"

      - name: 🎉 Success Message
        if: success()
        run: |
          echo "=========================================="
          echo "   ✅ BUILD SUCCESSFUL!"
          echo "   Version: v${{ steps.version.outputs.name }}"
          echo "   Artifact: ${{ steps.locate.outputs.path }}"
          echo "=========================================="
