name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix Gradle wrapper & permissions
        run: |
          cd android
          chmod +x gradlew
          ls -la gradle/wrapper/

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Show APK file & path
        run: |
          echo "=== CHECKING APK ==="
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "✅ APK FOUND!"
            ls -lh "$APK_PATH"
          else
            echo "❌ APK NOT CREATED — LISTING FOLDERS:"
            find android -type d -name "apk" 2>/dev/null || echo "No 'apk' folder at all"
            find android -name "*.apk" 2>/dev/null || echo "No .apk files anywhere"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Martodosko-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
