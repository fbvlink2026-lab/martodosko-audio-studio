name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏷️ KUNIN ANG BERSYON
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          fi
          VERSION_NAME="${VERSION_TAG#v}"
          VERSION_CODE=$(echo "$VERSION_NAME" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }')
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: ✍️ ISULAT SA build.gradle.kts
        run: |
          FILE="android/app/build.gradle.kts"
          if [ -f "$FILE" ]; then
            sed -i "s/versionCode *= *[0-9]*/versionCode = ${{ steps.version.outputs.code }}/" "$FILE"
            sed -i "s/versionName *= *\"[^\"]*\"/versionName = \"${{ steps.version.outputs.name }}\"/" "$FILE"
          fi

      - name: 📋 LISTAHAN NG FOLDER
        run: |
          echo "=========================================="
          echo "   📂 LAHAT NG FOLDER SA REPOSITORY"
          echo "=========================================="
          find . -maxdepth 5 -type d | grep -v '.git' | sort

      - name: 🔍 TIGNAN KUNG MAY GRADLE WRAPPER NA
        id: check_wrapper
        run: |
          cd android
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "✅ MERON NA ANG WRAPPER — walang babaguhin"
            echo "has_wrapper=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ KULANG ANG WRAPPER — kailangang i-setup"
            echo "has_wrapper=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Gradle 8.2 (KUNG KULANG LANG)
        if: steps.check_wrapper.outputs.has_wrapper == 'false'
        run: |
          cd android
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH=/tmp/gradle-8.2/bin:$PATH
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Siguraduhing Pwede ang gradlew
        run: |
          cd android
          chmod +x ./gradlew 2>/dev/null || true

      - name: 🔨 BUILD APK
        id: do_build
        run: |
          mkdir -p /tmp
          ERROR_FILE="/tmp/errors-content.txt"
          > "$ERROR_FILE"

          cd android
          ./gradlew assembleDebug 2>&1 | tee ../build-log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          cd ..

          # ✅ HANAPIN ANG NABUONG APK
          APK_FILE=$(find android -name "app-debug.apk" -path "*/build/*/debug/*" 2>/dev/null | head -1)

          {
            echo "=================================================="
            echo "📦 APLIKASYON: Martodosko Audio Studio"
            echo "📂 LOKASYON:   android/app"
            echo "⏰ ORAS:       $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo "🏷️ BERSYON:    ${{ steps.version.outputs.tag }}"
            echo "📤 EXIT CODE:  $EXIT_CODE"
            echo "=================================================="
            echo ""

            if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
              APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
              echo "✅ TAGUMPAY — NABUO ANG APK!"
              echo "📂 APK Daan:   $APK_FILE"
              echo "📏 Laki:       $APK_SIZE"

              # ==========================================
              # ✅ KOPYAHIN SA docs/ — TUNAY NA APK HINDI ZIP
              # ==========================================
              mkdir -p docs
              NEW_APK_NAME="Martodosko-Studio-${{ steps.version.outputs.tag }}.apk"
              cp "$APK_FILE" "docs/$NEW_APK_NAME"
              echo "✅ NAKOPYA SA: docs/$NEW_APK_NAME"

              # ✅ LIKHA NG version.json — para sa Auto-Update
              cat > docs/version.json <<JSON
              {
                "versionTag": "${{ steps.version.outputs.tag }}",
                "versionName": "${{ steps.version.outputs.name }}",
                "versionCode": ${{ steps.version.outputs.code }},
                "apkFile": "$NEW_APK_NAME",
                "downloadUrl": "https://raw.githubusercontent.com/${{ github.repository }}/main/docs/$NEW_APK_NAME",
                "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              }
              JSON
              echo "✅ Nalikha ang: docs/version.json"

              echo "APK_COPIED=true" >> $GITHUB_ENV
            else
              echo "❌ NABIGO — Hindi nabuo o hindi mahanap ang APK"
              echo "🔑 Exit Code: $EXIT_CODE"
              echo ""
              echo "📂 BUONG LISTA NG android/app/build:"
              ls -la android/app/build/ 2>/dev/null || echo "❌ Wala pang build folder"
              echo "APK_COPIED=false" >> $GITHUB_ENV
            fi

            echo ""
            echo "--------------------------------------------------"
            echo "📋 BUONG LOG NG BUILD:"
            echo "--------------------------------------------------"
            cat build-log.txt
            echo ""
          } >> "$ERROR_FILE"

          exit $EXIT_CODE

      - name: 📄 ISULAT SA docs/failed.md
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          OUTPUT_FILE="$GITHUB_WORKSPACE/docs/failed.md"
          TEMP_FILE="/tmp/errors-final.md"

          {
            echo "# 📋 Build Log — Martodosko Audio Studio"
            echo ""
            echo "> Created & Developed by MartoDosko © Copyright 2026"
            echo ""
            echo "---"
            echo "📅 **Petsa:** $DATE"
            echo "🏷️ **Bersyon:** ${{ steps.version.outputs.tag }}"
            echo "---"
            echo ""
            cat /tmp/errors-content.txt
            echo ""
            echo "---"
            echo "✅ **Katapusan ng Talaan**"
          } > "$TEMP_FILE"

          cp "$TEMP_FILE" "$OUTPUT_FILE"
          echo "✅ docs/failed.md naisulat na!"

      - name: 📤 I-UPLOAD BILANG ARTIFACT
        if: env.APK_COPIED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Martodosko-APK-${{ steps.version.outputs.tag }}
          path: docs/
          retention-days: 30

      - name: ✅ I-COMMIT ANG docs/ SA GITHUB — TUNAY NA APK HINDI ZIP
        if: env.APK_COPIED == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ✅ APK + version.json + lahat ng nasa docs/ — ia-commit
          git add docs/

          if git diff --staged --quiet; then
            echo "ℹ️ Walang bagong ia-commit"
          else
            git commit -m "📦 Build: ${{ steps.version.outputs.tag }} — APK + version.json" || true
            git push || true
            echo "✅ NA-COMMIT — nasa docs/ na ang APK!"
          fi
