name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏷️ KUNIN ANG BERSYON
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          fi
          VERSION_NAME="${VERSION_TAG#v}"
          VERSION_CODE=$(echo "$VERSION_NAME" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }')
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: ✍️ ISULAT SA build.gradle.kts
        run: |
          FILE="android/app/build.gradle.kts"
          if [ -f "$FILE" ]; then
            sed -i "s/versionCode *= *[0-9]*/versionCode = ${{ steps.version.outputs.code }}/" "$FILE"
            sed -i "s/versionName *= *\"[^\"]*\"/versionName = \"${{ steps.version.outputs.name }}\"/" "$FILE"
          fi

      - name: 📋 LISTAHAN NG FOLDER
        run: |
          echo "=========================================="
          echo "   📂 LAHAT NG FOLDER SA REPOSITORY"
          echo "=========================================="
          find . -maxdepth 5 -type d | grep -v '.git' | sort

      - name: 🔍 TIGNAN KUNG MAY GRADLE WRAPPER NA
        id: check_wrapper
        run: |
          cd android
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "✅ MERON NA ANG WRAPPER — walang babaguhin"
            echo "has_wrapper=true" >> $GITHUB_ENV
          else
            echo "⚠️ KULANG ANG WRAPPER — kailangang i-setup"
            echo "has_wrapper=false" >> $GITHUB_ENV
          fi

      - name: Setup Gradle 8.2 (KUNG KULANG LANG)
        if: steps.check_wrapper.outputs.has_wrapper == 'false'
        run: |
          cd android
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH=/tmp/gradle-8.2/bin:$PATH
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Siguraduhing Pwede ang gradlew
        run: |
          cd android
          chmod +x ./gradlew 2>/dev/null || true

      # ==========================================
      # 🔨 BUILD APK — KOPYAHIN AGAD + MAS MALAWAK NA PAGHANAP
      # ==========================================
      - name: 🔨 BUILD APK
        id: do_build
        run: |
          mkdir -p /tmp
          LOG_FILE="/tmp/build-full.log"
          ERROR_FILE="/tmp/errors-content.txt"
          ERROR_LINES_FILE="/tmp/error-lines.txt"
          CRASH_CAUSES_FILE="/tmp/crash-causes.txt"
          APK_SAVE="/tmp/app-debug.apk"
          > "$ERROR_FILE"
          > "$ERROR_LINES_FILE"
          > "$CRASH_CAUSES_FILE"

          cd android
          set +e
          ./gradlew assembleDebug 2>&1 | tee "$LOG_FILE"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          # 🚨 KOPYAHIN AGAD — HANAPIN SA LAHAT NG LUGAR HINDI LANG SA TINDIYAK NA DAAN!
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ BUILD SUCCESS — hinahanap ang APK..."
            
            # ✅ HANAPIN SA BUONG app/build/ — KAHIT SAAN ITO ILAGAY NG GRADLE
            APK_BUILD_PATH=$(find app/build -name "*.apk" 2>/dev/null | head -1)
            
            if [ -n "$APK_BUILD_PATH" ] && [ -f "$APK_BUILD_PATH" ]; then
              echo "✅ NAHANAP ANG APK SA: $APK_BUILD_PATH"
              cp "$APK_BUILD_PATH" "$APK_SAVE"
              ls -lh "$APK_SAVE"
              echo "APK_FOUND=true" >> $GITHUB_ENV
            else
              echo "❌ HINDI MAHANAP ANG APK — ILISTA ANG BUILD FOLDER:"
              ls -la app/build/ 2>/dev/null || echo "❌ WALANG build folder"
              echo "APK_FOUND=false" >> $GITHUB_ENV
            fi
          else
            echo "❌ BUILD FAILED — Exit Code: $EXIT_CODE"
            echo "APK_FOUND=false" >> $GITHUB_ENV
          fi

          cd ..

          # 📋 I-LISTA PARA MAKITA — NAWALA BA TALAGA O NASA IBA LUGAR?
          echo ""
          echo "📂 --- SURIIN ANG android/app/build/ ---"
          if [ -d "android/app/build" ]; then
            echo "✅ MERON build folder!"
            find android/app/build -name "*.apk" 2>/dev/null
          else
            echo "⚠️ WALANG build folder — kaya KOPYA AGAD SA /tmp ang solusyon!"
          fi
          echo ""
          echo "📂 --- APK NA NAKOPYA SA /tmp/ ---"
          ls -lh "$APK_SAVE" 2>/dev/null || echo "❌ Wala sa /tmp"

          # ==========================================================
          # 🚨 KUKUHA NG MGA TIYAK NA DAHILAN NG PAGKA-CRASH NG APP
          # ==========================================================
          echo "🚨 KINUKUHA ANG MGA DAHILAN NG CRASH..."
          {
            echo "## 💥 MGA TIYAK NA DAHILAN NG PAGKA-CRASH NG APP:"
            echo ""
            echo "> Ito ang mga partikular na isyu na magiging sanhi ng pag-crash kapag binuksan ang aplikasyon:"
            echo ""
            grep -n -iE \
              'resource.*not found|ClassNotFoundException|NoClassDefFoundError|UnsatisfiedLinkError|InstantiationException|VerifyError|AndroidRuntime|FATAL EXCEPTION|NullPointerException|ActivityNotFoundException|INSTALL_FAILED|parsing error|manifest.*error|versionCode|minSdk|targetSdk|namespace|package.*not supported' \
              "$LOG_FILE" || echo "*Walang direktang nakitang sanhi ng crash — pero suriin ang babala sa ibaba*"

            echo ""
            echo "---"
            echo ""
            echo "## ⚠️ MGA BABALA AT IMPORMASYON:"
            echo ""
            grep -n -iE 'warning|deprecated|recommendation|should be removed|no signing config' "$LOG_FILE" || echo "*Walang babala*"
          } > "$CRASH_CAUSES_FILE"

          # ==========================================================
          # 🚨 KUKUHA NG LAHAT NG ERROR / PULANG LINYA
          # ==========================================================
          echo "🚨 KINUKUHA ANG LAHAT NG ERROR SA LOG..."
          {
            echo "## 🚨 LAHAT NG ERROR NA NAKITA:"
            echo ""
            grep -n -iE 'error|failed|failure|exception|caused by|unable to|cannot|could not|BUILD FAILED' "$LOG_FILE" || echo "*Walang nakitang tiyak na salitang error*"
            echo ""
            echo "---"
            echo ""
            echo "## 📋 BUONG BUILD LOG:"
            echo "\`\`\`"
            cat "$LOG_FILE"
            echo "\`\`\`"
          } > "$ERROR_LINES_FILE"

          # ==========================================================
          # 📄 BUUIN ANG BUONG TALAAN — HINDI BINABAGO ANG PORMAT!
          # ==========================================================
          {
            echo "=================================================="
            echo "📦 APLIKASYON: Martodosko Audio Studio"
            echo "📂 LOKASYON:   android/app"
            echo "⏰ ORAS:       $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo "🏷️ BERSYON:    ${{ steps.version.outputs.tag }}"
            echo "📤 EXIT CODE:  $EXIT_CODE"
            echo "=================================================="
            echo ""

            if [ "${{ env.APK_FOUND }}" = "true" ] && [ -f "$APK_SAVE" ]; then
              APK_SIZE=$(du -h "$APK_SAVE" | cut -f1)
              echo "✅ TAGUMPAY — NABUO ANG APK!"
              echo "📂 APK Lokasyon:  $APK_SAVE"
              echo "📏 Laki:          $APK_SIZE"
            else
              echo "❌ NABIGO — Hindi nabuo o hindi mahanap ang APK"
              echo "🔑 Exit Code: $EXIT_CODE"
            fi
            echo ""
            echo "--------------------------------------------------"
            cat "$CRASH_CAUSES_FILE"
            echo ""
            echo "--------------------------------------------------"
            echo "🚨 MGA DETALYE NG ERROR:"
            echo "--------------------------------------------------"
            cat "$ERROR_LINES_FILE"
          } >> "$ERROR_FILE"

          exit $EXIT_CODE

      # ==========================================================
      # 🛡️ PROTEKTAHAN ANG docs/ — KOPYAHIN MULA SA /tmp/ HINDI SA BUILD
      # ==========================================================
      - name: 🛡️ PROTECT — Kopyahin APK MULA SA /tmp/ papuntang docs/
        if: env.APK_FOUND == 'true'
        run: |
          DOCS_DIR="./docs"
          APK_SOURCE="/tmp/app-debug.apk"
          BACKUP="/tmp/docs-FULL-backup"

          mkdir -p "$BACKUP"
          mkdir -p "$DOCS_DIR"
          cp -R "$DOCS_DIR"/. "$BACKUP/" 2>/dev/null || true

          NEW_APK_NAME="Martodosko-Studio-${{ steps.version.outputs.tag }}.apk"
          cp "$APK_SOURCE" "$DOCS_DIR/$NEW_APK_NAME"
          echo "✅ APK NAKOPYA SA: docs/$NEW_APK_NAME"
          ls -lh "$DOCS_DIR/"

          cat > "$DOCS_DIR/version.json" <<JSON
          {
            "versionTag": "${{ steps.version.outputs.tag }}",
            "versionName": "${{ steps.version.outputs.name }}",
            "versionCode": ${{ steps.version.outputs.code }},
            "apkFile": "$NEW_APK_NAME",
            "downloadUrl": "https://raw.githubusercontent.com/${{ github.repository }}/main/docs/$NEW_APK_NAME",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

          cp -R "$BACKUP"/. "$DOCS_DIR/" 2>/dev/null || true
          echo "✅ LAHAT SA docs/ — LIGTAS AT BUO!"

      # ==========================================================
      # 📄 ISULAT SA docs/failed.md — HINDI GINALAW ANG PORMAT!
      # ==========================================================
      - name: 📄 ISULAT SA docs/failed.md — BUONG LOG + MGA ERROR
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          OUTPUT_FILE="./docs/failed.md"
          TEMP_FILE="/tmp/errors-final.md"

          mkdir -p ./docs

          {
            echo "# 📋 Build Log — Martodosko Audio Studio"
            echo ""
            echo "> Created & Developed by MartoDosko © Copyright 2026"
            echo ""
            echo "---"
            echo "📅 **Petsa:** $DATE"
            echo "🏷️ **Bersyon:** ${{ steps.version.outputs.tag }}"
            echo "---"
            echo ""
            cat /tmp/errors-content.txt
            echo ""
            echo "---"
            echo "✅ **Katapusan ng Talaan**"
          } > "$TEMP_FILE"

          cp "$TEMP_FILE" "$OUTPUT_FILE"
          echo "✅ docs/failed.md NAISULAT!"

      # ==========================================================
      # 📤 I-UPLOAD
      # ==========================================================
      - name: 📤 I-UPLOAD BILANG ARTIFACT
        if: env.APK_FOUND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Martodosko-APK-${{ steps.version.outputs.tag }}
          path: docs/
          retention-days: 30

      # ==========================================================
      # ✅ I-COMMIT
      # ==========================================================
      - name: ✅ I-COMMIT ANG docs/
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "ℹ️ Walang pagbabago"
          else
            git commit -m "📦 Build: ${{ steps.version.outputs.tag }} — APK + Log + Errors" || true
            git push || true
            echo "✅ NAI-COMMIT — NASA docs/ NA SA GITHUB!"
          fi
