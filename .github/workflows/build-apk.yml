name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x ./android/gradlew

      - name: Build APK
        id: build-step
        continue-on-error: true
        run: |
          cd android
          ./gradlew assembleDebug 2>&1 | tee ../build-log.txt

      - name: Log pagkabigo sa docs/failed.md
        if: steps.build-step.outcome == 'failure'
        run: ./.github/scripts/log-failure.sh

      - name: Itigil ang trabaho kung bumagsak
        if: steps.build-step.outcome == 'failure'
        run: exit 1

      - name: I-upload ang APK
        if: steps.build-step.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Martodosko-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
