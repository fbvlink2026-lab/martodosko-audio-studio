name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏷️ KUNIN ANG BERSYON
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          fi
          VERSION_NAME="${VERSION_TAG#v}"
          VERSION_CODE=$(echo "$VERSION_NAME" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }')
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: ✍️ ISULAT SA build.gradle.kts
        run: |
          FILE="app/build.gradle.kts"
          if [ -f "$FILE" ]; then
            sed -i "s/versionCode *= *[0-9]*/versionCode = ${{ steps.version.outputs.code }}/" "$FILE"
            sed -i "s/versionName *= *\"[^\"]*\"/versionName = \"${{ steps.version.outputs.name }}\"/" "$FILE"
          fi

      - name: 🔨 BUILD APK
        id: do_build
        run: |
          # ✅ Nasa ugat na — WALANG cd android!
          chmod +x gradlew
          ./gradlew assembleDebug

          # ✅ TAMA NA ANG DAAN — app/build/ HINDI android/app/build/
          APK_FILE=$(find app/build/outputs/apk/debug -maxdepth 2 -name "*.apk" 2>/dev/null | head -1)

          if [ -f "$APK_FILE" ]; then
            echo "✅ Nahanap ang APK: $APK_FILE"
            echo "apk_found=true" >> $GITHUB_OUTPUT
            echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          else
            echo "❌ Hindi mahanap ang APK"
            echo "apk_found=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: 📤 KOPYAHIN ANG APK SA docs/
        if: steps.do_build.outputs.apk_found == 'true'
        run: |
          mkdir -p docs
          APK_PATH="${{ steps.do_build.outputs.apk_path }}"
          NEW_NAME="Martodosko-Studio-${{ steps.version.outputs.tag }}.apk"
          cp "$APK_PATH" "docs/$NEW_NAME"
          echo "✅ Nakopya sa docs/$NEW_NAME"
          ls -lh docs/*.apk

          cat > docs/version.json <<JSON
          {
            "versionTag": "${{ steps.version.outputs.tag }}",
            "versionName": "${{ steps.version.outputs.name }}",
            "versionCode": ${{ steps.version.outputs.code }},
            "apkFile": "$NEW_NAME",
            "updatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          echo "✅ Nalikha ang docs/version.json"

      - name: 📄 BUUIN ANG BUILD LOG
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M UTC")
          mkdir -p docs
          cat > docs/build-log.md <<EOF
          # 📋 Build Log — Martodosko Audio Studio
          > Created & Developed by MartoDosko © Copyright 2026
          ---
          📅 **Petsa:** $DATE
          🏷️ **Bersyon:** ${{ steps.version.outputs.tag }}
          ---
          ✅ APK: Martodosko-Studio-${{ steps.version.outputs.tag }}.apk
          EOF

      - name: 📤 I-UPLOAD BILANG ARTIFACT
        if: steps.do_build.outputs.apk_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Martodosko-APK-${{ steps.version.outputs.tag }}
          path: docs/
          retention-days: 30

      - name: ✅ I-COMMIT ANG docs/ SA GITHUB
        if: steps.do_build.outputs.apk_found == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "📦 Build: ${{ steps.version.outputs.tag }} — APK + version.json" || true
          git pull origin main --rebase 2>/dev/null || true
          git push || true
