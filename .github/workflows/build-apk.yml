name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🏷️ KUNIN ANG BERSYON
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          fi
          VERSION_NAME="${VERSION_TAG#v}"
          VERSION_CODE=$(echo "$VERSION_NAME" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }')
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

      # ✅ WALA NANG "cd android" — direkta na sa ugat!
      - name: 🔨 BUILD ANG APK
        id: build_step
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

          # ✅ TAMA NA ANG DAAN — wala nang "android/"!
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "✅ Nahanap: $APK_PATH"
            echo "FOUND=yes" >> $GITHUB_ENV
            echo "APK_RELATIVE=$APK_PATH" >> $GITHUB_ENV
          else
            echo "❌ Hindi mahanap ang APK"
            exit 1
          fi

      - name: 📤 KOPYAHIN SA docs/ — TUNAY NA APK, HINDI ZIP
        if: env.FOUND == 'yes'
        run: |
          mkdir -p docs
          # ✅ WALA NANG "android/" sa unahan!
          APK_SOURCE="${{ env.APK_RELATIVE }}"
          NEW_NAME="Martodosko-Studio-${{ steps.version.outputs.tag }}.apk"
          cp "$APK_SOURCE" "docs/$NEW_NAME"
          
          cat > docs/version.json <<JSON
          {
            "versionTag": "${{ steps.version.outputs.tag }}",
            "versionName": "${{ steps.version.outputs.name }}",
            "versionCode": ${{ steps.version.outputs.code }},
            "apkFilename": "$NEW_NAME",
            "downloadUrl": "https://raw.githubusercontent.com/${{ github.repository }}/main/docs/$NEW_NAME",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

          echo "✅ NAKOPYA SA docs/: $NEW_NAME"
          ls -lh docs/

      - name: ✅ I-COMMIT — APK SA docs/
        if: env.FOUND == 'yes'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git pull origin main --rebase 2>/dev/null || true
          git commit -m "📦 Build: ${{ steps.version.outputs.tag }} — APK + version.json" || true
          git push || true

      - name: 📤 I-UPLOAD BILANG ARTIFACT
        if: env.FOUND == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: Martodosko-APK-${{ steps.version.outputs.tag }}
          path: docs/
          retention-days: 30
