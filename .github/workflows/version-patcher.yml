# ==================================================
# 📄 FILE: version-patcher.yml
# 🏷️ VERSION: 1.0.18 — GINAYA ANG BUILD.YML! WALANG ERROR NA!
# 📅 UPDATED: 2026-09-12
# 🎯 PURPOSE: Add/update headers — app/ folder only
# ==================================================

name: Version Header Patcher

on:
  # ✅ TUMATAKBO LANG KAPAG PININDOT SA ACTIONS TAB — hindi kusang tumatakbo
  workflow_dispatch:
    inputs:
      mode:
        description: 'Piliin — all_app (lahat sa app/) o specific_app (partikular na files)'
        default: 'all_app'
      specific_files:
        description: 'Kung specific_app — ilagay ang path, hal: app/src/main/AndroidManifest.xml'
        default: ''

jobs:
  patch-headers:
    name: Add Version Headers
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4

      # ==================================================
      # 📖 BASAHIN ANG VERSION MULA SA version.json
      # ==================================================
      - name: 📖 Basahin ang Bersyon mula sa version.json
        id: get-version
        run: |
          echo "=========================================="
          echo "   📖 BASAHIN ANG BERSYON"
          echo "=========================================="
          
          if [ -f "docs/version.json" ]; then
            VERSION_NAME=$(grep -o '"version":"[^"]*"' docs/version.json | head -1 | cut -d'"' -f4)
            VERSION="${VERSION_NAME:-1.0.0}"
            echo "✅ Bersyon mula sa version.json: v$VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            VERSION="1.0.0"
            echo "⚠️ Walang version.json — gagamitin: v1.0.0"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
          
          DATE=$(date +%Y-%m-%d)
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "✅ Petsa: $DATE"

      # ==================================================
      # 🔄 PROSESO NG MGA FILE — GINAYA ANG SED FORMAT NG BUILD.YML!
      # ==================================================
      - name: 🔄 Proseso ng mga File — Lagyan o I-update ang Header
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          DATE="${{ steps.get-version.outputs.date }}"
          MODE="${{ github.event.inputs.mode }}"
          SPECIFIC_INPUT="${{ github.event.inputs.specific_files }}"
          
          echo "=========================================="
          echo "   🔄 SIMULAN ANG PAGPROSESO"
          echo "=========================================="
          echo "🎯 Target Bersyon: v$VERSION"
          echo "📂 Mode: $MODE"
          echo ""
          
          process_file() {
            local file="$1"
            local filename=$(basename "$file")
            
            # ✅ app/ folder lang — hindi iba pang folder
            [[ ! "$file" == app/* ]] && return
            # ✅ Suportadong file types lang
            [[ "$file" != *.xml && "$file" != *.kt && "$file" != *.kts && "$file" != *.gradle ]] && return
            
            # ✅ May header na? I-check ang version
            if grep -q "VERSION:" "$file"; then
              CURRENT_VER=$(grep -o 'VERSION: *[^ ]*' "$file" | head -n1 | sed 's/VERSION: *//')
              if [ "$CURRENT_VER" = "$VERSION" ]; then
                echo "✅ SKIP: $filename — already v$VERSION"
                return
              else
                echo "🔄 UPDATE: $filename — v$CURRENT_VER → v$VERSION"
                # ==================================================
                # ✅ GINAYA ANG EKSAKTONG SED FORMAT MULA SA BUILD.YML!
                # WALANG '' WALANG .bak — DIREKTANG sed -i LANG!
                # ==================================================
                sed -i "s/VERSION: *[^ ]*/VERSION: $VERSION/" "$file"
                sed -i "s/UPDATED: *[0-9-]*/UPDATED: $DATE/" "$file"
                return
              fi
            fi
            
            # ✅ Walang header — IDADAGDAG NG BAGONG HEADER
            echo "➕ ADD: $filename — new header v$VERSION"
            local first_line=$(head -n 1 "$file")
            
            if [[ "$file" == *.xml ]]; then
              if [[ "$first_line" == "<?xml"* ]]; then
                local rest=$(tail -n +2 "$file")
                echo "$first_line" > "$file"
                echo "<!-- ================================================== -->" >> "$file"
                echo "<!-- FILE: $filename -->" >> "$file"
                echo "<!-- VERSION: $VERSION -->" >> "$file"
                echo "<!-- UPDATED: $DATE -->" >> "$file"
                echo "<!-- ================================================== -->" >> "$file"
                echo "$rest" >> "$file"
              fi
            else
              echo "// ==================================================" > "$file.tmp"
              echo "// FILE: $filename" >> "$file.tmp"
              echo "// VERSION: $VERSION" >> "$file.tmp"
              echo "// UPDATED: $DATE" >> "$file.tmp"
              echo "// ==================================================" >> "$file.tmp"
              cat "$file" >> "$file.tmp"
              mv "$file.tmp" "$file"
            fi
          }
          
          # ✅ Ayon sa pinili — all_app o specific_app
          if [ "$MODE" = "specific_app" ] && [ -n "$SPECIFIC_INPUT" ]; then
            echo "📂 Proseso ng mga partikular na file..."
            IFS=',' read -ra FILES <<< "$SPECIFIC_INPUT"
            for fname in "${FILES[@]}"; do
              fname=$(echo "$fname" | xargs)
              [[ ! "$fname" == app/* ]] && fname="app/$fname"
              [ -f "$fname" ] && process_file "$fname"
            done
          else
            echo "📂 Proseso ng lahat ng files sa app/ folder..."
            find ./app -type f \( -name "*.xml" -o -name "*.kt" -o -name "*.kts" -o -name "*.gradle" \) \
              -not -path "*/build/*" -not -path "*/.git/*" | while read file; do
              process_file "$file"
            done
          fi
          
          echo ""
          echo "✅ TAPOS NA ANG PAGPROSESO!"

      # ==================================================
      # ✅ I-COMMIT AT I-PUSH — GINAYA ANG BUILD.YML!
      # ==================================================
      - name: ✅ I-commit at i-push ang mga pagbabago
        if: always()
        continue-on-error: true
        run: |
          echo "=========================================="
          echo "   ✅ I-COMMIT AT I-PUSH"
          echo "=========================================="
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          VERSION="${{ steps.get-version.outputs.version }}"
          
          if git diff --staged --quiet; then
            echo "✅ WALANG PAGBABAGO — lahat tama na!"
          else
            git commit -m "🤖 Update headers — v$VERSION" --allow-empty
            git push origin main
            echo "✅ TAPOS NA! Headers updated to v$VERSION"
          fi
