# ==================================================
# 📄 FILE: version-patcher.yml
# 🏷️ VERSION: 1.0.7 — AUTO-UPDATE VERSION IF MISMATCH!
# 📅 UPDATED: 2026-09-12
# 🎯 PURPOSE: Add header if missing OR UPDATE version if mismatch
# ⚠️ RULES:
#   🔴 MANUAL RUN ONLY
#   ✅ READS VERSION FROM docs/version.json
#   ✅ ADD header — kung wala pa
#   ✅ UPDATE version — kung may header na pero mali ang version
#   ✅ SKIP — kung may header na AT TAMA ANG VERSION
#   📂 ONLY app/ folder — NEVER touch other folders
# ==================================================

name: Version Header Patcher

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Anong files ang ipapalagayan/ia-update ng header?'
        required: true
        default: 'all_app'
        type: choice
        options:
          - all_app
          - specific_app
      specific_files:
        description: 'Kung specific — ilagay ang path (hal: app/src/main/...)'
        required: false
        default: ''

jobs:
  patch-headers:
    name: Add/Update Version Headers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Version from version.json
        id: get-version
        run: |
          if [ -f "docs/version.json" ]; then
            VERSION_NAME=$(grep -o '"versionName"[[:space:]]*:[[:space:]]*"[^"]*"' docs/version.json | cut -d'"' -f4)
            VERSION="${VERSION_NAME:-1.0.0}"
            echo "✅ Target Version: v$VERSION (mula docs/version.json)"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            VERSION="1.0.0"
            echo "⚠️ No version.json — default v1.0.0"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
          DATE=$(date +%Y-%m-%d)
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Process Files — ADD or UPDATE Header
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          DATE="${{ steps.get-version.outputs.date }}"
          MODE="${{ github.event.inputs.mode }}"
          SPECIFIC_INPUT="${{ github.event.inputs.specific_files }}"
          
          # ==============================================
          # ✅ FUNCTION: ADD OR UPDATE HEADER
          # ==============================================
          process_file() {
            local file="$1"
            local filename=$(basename "$file")
            
            # Skip if not in app/ folder
            [[ ! "$file" == app/* ]] && return
            
            # Skip if not a supported file type
            [[ "$file" != *.xml && "$file" != *.kt && "$file" != *.kts && "$file" != *.gradle ]] && return
            
            # ✅ CHECK: May header ba?
            if grep -q "FILE:" "$file"; then
              # ✅ May header na — CHECK ANG VERSION
              CURRENT_VER=$(grep -o 'VERSION: [^ ]*' "$file" | head -n1 | cut -d' ' -f2)
              
              if [ "$CURRENT_VER" = "$VERSION" ]; then
                echo "✅ SKIP — $filename — header at version TAMA NA"
                return
              else
                echo "🔄 UPDATE — $filename — lumang version: $CURRENT_VER → bago: $VERSION"
                # ✅ PALITAN LANG ANG VERSION SA HEADER — huwag galawin ang laman!
                if [[ "$file" == *.xml ]]; then
                  sed -i "s/VERSION: [^ ]*/VERSION: $VERSION/" "$file"
                  sed -i "s/UPDATED: [0-9-]*/UPDATED: $DATE/" "$file"
                else
                  sed -i "s/VERSION: [^ ]*/VERSION: $VERSION/" "$file"
                  sed -i "s/UPDATED: [0-9-]*/UPDATED: $DATE/" "$file"
                fi
                return
              fi
            fi
            
            # ✅ WALANG HEADER — IDADAGDAG NG BAGO
            echo "➕ ADD — $filename — walang header pa"
            local first_line=$(head -n 1 "$file")
            
            if [[ "$file" == *.xml ]]; then
              if [[ "$first_line" == "<?xml"* ]]; then
                local rest=$(tail -n +2 "$file")
                local header="<!-- ================================================== -->
<!-- FILE: $filename -->
<!-- VERSION: $VERSION -->
<!-- UPDATED: $DATE -->
<!-- ================================================== -->
"
                echo "$first_line" > "$file"
                echo "$header" >> "$file"
                echo "$rest" >> "$file"
              fi
            else
              local header="// ==================================================
// FILE: $filename
// VERSION: $VERSION
// UPDATED: $DATE
// ==================================================

"
              echo "$header$(cat "$file")" > "$file"
            fi
          }
          
          # ==============================================
          # ✅ AYUSIN ANG PAGPIPILIAN
          # ==============================================
          if [ "$MODE" = "specific_app" ] && [ -n "$SPECIFIC_INPUT" ]; then
            echo "🔧 Proseso ng mga piniling file..."
            IFS=',' read -ra FILES <<< "$SPECIFIC_INPUT"
            for fname in "${FILES[@]}"; do
              fname=$(echo "$fname" | xargs)
              [[ ! "$fname" == app/* ]] && fname="app/$fname"
              [ -f "$fname" ] && process_file "$fname"
            done
          else
            echo "🔧 Proseso ng lahat ng files sa app/ folder..."
            find ./app -type f \( -name "*.xml" -o -name "*.kt" -o -name "*.kts" -o -name "*.gradle" \) \
              -not -path "*/build/*" -not -path "*/.git/*" | while read file; do
              process_file "$file"
            done
          fi

      - name: Show Changes Summary
        run: |
          echo "=================================================="
          echo "📋 BUOD NG PAGBABAGO:"
          echo "=================================================="
          git diff --stat
          echo ""
          echo "✅ Header lang ang binago — walang code na naapektuhan!"
          echo "=================================================="

      - name: Commit & Push
        run: |
          git config --global user.name "Martodosko Bot"
          git config --global user.email "martodosko-studio@users.noreply.github.com"
          git add -A
          
          VERSION="${{ steps.get-version.outputs.version }}"
          
          if git diff --staged --quiet; then
            echo "✅ WALANG KAILANGANG BAGUHIN — lahat tama na!"
          else
            git commit -m "🤖 Update headers — v$VERSION — auto add/fix version"
            git push
            echo "✅ TAPOS NA! Headers updated to v$VERSION!"
          fi
