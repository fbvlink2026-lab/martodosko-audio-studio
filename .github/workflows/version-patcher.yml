# ==================================================
# 📄 FILE: version-patcher.yml — MAY PAGPIPILIAN NA ULIT!
# 🎯 PURPOSE: Add/update version headers — app/ folder only
# ✅ MAY PAGPIPILIAN: all_app o specific_app — SIMPLE LANG!
# ==================================================

name: Version Header Patcher

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Piliin — all_app (lahat sa app/) o specific_app (partikular na file)'
        default: 'all_app'
      specific_files:
        description: 'Kung specific_app — ilagay ang path, hal: app/src/main/AndroidManifest.xml'
        default: ''

jobs:
  patch-headers:
    name: Add Version Headers
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4

      # ==================================================
      # 🏷️ BASAHIN ANG BERSYON — EKSAKTONG KATULAD NG BUILD.YML!
      # ==================================================
      - name: 🏷️ Basahin ang Bersyon mula sa version.json
        id: version
        run: |
          if [ -f docs/version.json ]; then
            CURRENT_VER=$(grep -o '"version":"[^"]*"' docs/version.json | head -1 | cut -d'"' -f4)
            echo "📖 Bersyon mula sa version.json: v$CURRENT_VER"
            VERSION_NAME="$CURRENT_VER"
          else
            echo "⚠️ Walang version.json — gagamitin: v1.0.0"
            VERSION_NAME="1.0.0"
          fi
          
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "✅ Target Bersyon: v$VERSION_NAME"
          DATE=$(date +%Y-%m-%d)
          echo "date=$DATE" >> $GITHUB_OUTPUT

      # ==================================================
      # 🔄 PROSESO NG MGA FILE — MAY PAGPIPILIAN!
      # ==================================================
      - name: 🔄 Proseso ng mga File — Lagyan o I-update ang Header
        run: |
          VERSION_NAME="${{ steps.version.outputs.name }}"
          DATE="${{ steps.version.outputs.date }}"
          MODE="${{ github.event.inputs.mode }}"
          SPECIFIC_INPUT="${{ github.event.inputs.specific_files }}"
          
          echo "=========================================="
          echo "   🔄 SIMULAN ANG PAGPROSESO"
          echo "=========================================="
          echo "🎯 Bersyon: v$VERSION_NAME"
          echo "📂 Mode: $MODE"
          echo ""
          
          process_file() {
            local file="$1"
            local filename=$(basename "$file")
            
            [[ ! "$file" == app/* ]] && return
            [[ "$file" != *.xml && "$file" != *.kt && "$file" != *.kts && "$file" != *.gradle ]] && return
            
            if grep -q "VERSION:" "$file"; then
              CURRENT_VER=$(grep -o 'VERSION: *[^ ]*' "$file" | head -n1 | sed 's/VERSION: *//')
              if [ "$CURRENT_VER" = "$VERSION_NAME" ]; then
                echo "✅ SKIP: $filename — already v$VERSION_NAME"
                return
              else
                echo "🔄 UPDATE: $filename — v$CURRENT_VER → v$VERSION_NAME"
                sed -i "s/VERSION: *[^ ]*/VERSION: $VERSION_NAME/" "$file"
                sed -i "s/UPDATED: *[0-9-]*/UPDATED: $DATE/" "$file"
                return
              fi
            fi
            
            echo "➕ ADD: $filename — new header v$VERSION_NAME"
            local first_line=$(head -n 1 "$file")
            
            if [[ "$file" == *.xml ]]; then
              if [[ "$first_line" == "<?xml"* ]]; then
                local rest=$(tail -n +2 "$file")
                echo "$first_line" > "$file"
                echo "<!-- ================================================== -->" >> "$file"
                echo "<!-- FILE: $filename -->" >> "$file"
                echo "<!-- VERSION: $VERSION_NAME -->" >> "$file"
                echo "<!-- UPDATED: $DATE -->" >> "$file"
                echo "<!-- ================================================== -->" >> "$file"
                echo "$rest" >> "$file"
              fi
            else
              echo "// ==================================================" > "$file.tmp"
              echo "// FILE: $filename" >> "$file.tmp"
              echo "// VERSION: $VERSION_NAME" >> "$file.tmp"
              echo "// UPDATED: $DATE" >> "$file.tmp"
              echo "// ==================================================" >> "$file.tmp"
              cat "$file" >> "$file.tmp"
              mv "$file.tmp" "$file"
            fi
          }
          
          # ✅ MAY PAGPIPILIAN — all_app o specific_app
          if [ "$MODE" = "specific_app" ] && [ -n "$SPECIFIC_INPUT" ]; then
            echo "📂 Specific files mode..."
            IFS=',' read -ra FILES <<< "$SPECIFIC_INPUT"
            for fname in "${FILES[@]}"; do
              fname=$(echo "$fname" | xargs)
              [[ ! "$fname" == app/* ]] && fname="app/$fname"
              [ -f "$fname" ] && process_file "$fname"
            done
          else
            echo "📂 All app/ files mode..."
            find ./app -type f \( -name "*.xml" -o -name "*.kt" -o -name "*.kts" -o -name "*.gradle" \) \
              -not -path "*/build/*" -not -path "*/.git/*" | while read file; do
              process_file "$file"
            done
          fi
          
          echo ""
          echo "✅ TAPOS NA ANG PAGPROSESO!"

      # ==================================================
      # ✅ I-COMMIT AT I-PUSH — EKSAKTONG KATULAD NG BUILD.YML!
      # ==================================================
      - name: ✅ I-commit at i-push ang mga pagbabago
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add app/ 2>/dev/null || true
          
          VERSION_NAME="${{ steps.version.outputs.name }}"
          
          git commit -m "🤖 Update headers — v$VERSION_NAME" --allow-empty || true
          
          git push origin main || echo "⚠️ Hindi maipush — pero tapos na ang pagproseso!"
