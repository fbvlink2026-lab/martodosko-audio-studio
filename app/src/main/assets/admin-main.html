<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Admin Panel — Martodosko Audio Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        :root {
            --bg-dark: #0F0F1A;
            --bg-sidebar: #1A1A2E;
            --bg-content: #16162A;
            --accent: #FF5722;
            --accent-hover: #FF7043;
            --text-primary: #E0E0E0;
            --text-secondary: #888;
            --border: #2A2A5A;
            --active: #252550;
        }
        body { background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; }

        /* ===== ADMIN LAYOUT ===== */
        .admin-layout { display: flex; min-height: 100vh; }

        /* ===== GLOBAL ADMIN SIDEBAR ===== */
        .admin-sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        .admin-sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        .admin-sidebar-header h1 {
            font-size: 18px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-sidebar-header p { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
        .admin-sidebar-nav { flex: 1; padding: 16px 12px; }
        .admin-nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin-bottom: 4px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-primary);
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            font-size: 14px;
        }
        .admin-nav-item:hover { background: var(--active); }
        .admin-nav-item.active {
            background: var(--accent);
            color: white;
            font-weight: 600;
        }
        .admin-nav-item .icon { font-size: 18px; width: 24px; text-align: center; }
        .admin-sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
        }
        .admin-logout {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        .admin-logout:hover { background: var(--accent); color: white; }

        /* ===== MAIN CONTENT AREA ===== */
        .admin-content {
            flex: 1;
            margin-left: 260px;
            padding: 30px;
            background: var(--bg-content);
            min-height: 100vh;
        }
        .content-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        .content-header h2 { font-size: 24px; color: var(--accent); }
        .content-header p { color: var(--text-secondary); margin-top: 4px; }
        .content-loader {
            background: rgba(255, 87, 34, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            color: var(--text-secondary);
        }
        .content-loader .loading-icon { font-size: 32px; margin-bottom: 12px; }
        .content-frame { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .admin-sidebar { transform: translateX(-100%); transition: transform 0.3s; z-index: 100; }
            .admin-sidebar.open { transform: translateX(0); }
            .admin-content { margin-left: 0; padding: 16px; }
        }
    </style>
</head>
<body>

<div class="admin-layout">
    <!-- ===== GLOBAL ADMIN SIDE MENU ===== -->
    <aside class="admin-sidebar">
        <div class="admin-sidebar-header">
            <h1>🔐 ADMIN</h1>
            <p>Martodosko Audio Studio</p>
        </div>

        <nav class="admin-sidebar-nav">
            <button class="admin-nav-item active" data-page="dashboard">
                <span class="icon">📊</span>
                <span>Dashboard</span>
            </button>
            <button class="admin-nav-item" data-page="users">
                <span class="icon">👥</span>
                <span>Users</span>
            </button>
            <button class="admin-nav-item" data-page="permissions">
                <span class="icon">🔑</span>
                <span>Permissions</span>
            </button>
            <button class="admin-nav-item" data-page="presets">
                <span class="icon">🎛️</span>
                <span>Presets</span>
            </button>
            <button class="admin-nav-item" data-page="settings">
                <span class="icon">⚙️</span>
                <span>App Settings</span>
            </button>
            <button class="admin-nav-item" data-page="updates">
                <span class="icon">🔄</span>
                <span>Updates</span>
            </button>
            <button class="admin-nav-item" data-page="logs">
                <span class="icon">📋</span>
                <span>Activity Logs</span>
            </button>
        </nav>

        <div class="admin-sidebar-footer">
            <button class="admin-logout" onclick="logoutAdmin()">
                🚪 Logout
            </button>
        </div>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="admin-content">
        <div class="content-header">
            <h2 id="page-title">📊 Dashboard</h2>
            <p id="page-desc">Pangkalahatang-ideya ng proyekto</p>
        </div>

        <div id="content-area" class="content-frame">
            <div class="content-loader">
                <div class="loading-icon">⏳</div>
                <p>Loading Dashboard...</p>
            </div>
        </div>
    </main>
</div>

<script>
    // ===== GLOBAL ADMIN SYSTEM — TAMA NA ANG PATH! =====
    const pageConfig = {
        dashboard: {
            title: "📊 Dashboard",
            desc: "Pangkalahatang-ideya ng proyekto",
            file: "admin/admin-dashboard.html"  // ✅ TAMA — nasa assets/admin/
        },
        users: {
            title: "👥 User Management",
            desc: "Pamahalaan ang mga account ng user",
            file: "admin/admin-users.html"
        },
        permissions: {
            title: "🔑 Permission Control",
            desc: "Pagtakda ng antas ng karapatan",
            file: "admin/admin-permissions.html"
        },
        presets: {
            title: "🎛️ Preset Management",
            desc: "Pamahalaan ang mga preset na nakabahagi",
            file: "admin/admin-presets.html"
        },
        settings: {
            title: "⚙️ App Settings",
            desc: "Pangunahing pagsasaayos ng app",
            file: "admin/admin-settings.html"
        },
        updates: {
            title: "🔄 Update Manager",
            desc: "Pamahalaan ang mga bersyon at update",
            file: "admin/admin-updates.html"
        },
        logs: {
            title: "📋 Activity Logs",
            desc: "Kasaysayan ng lahat ng kilos",
            file: "admin/admin-logs.html"
        }
    };

    let currentPage = "dashboard";

    // ===== PAGPILI NG PAGE =====
    document.querySelectorAll('.admin-nav-item').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.admin-nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const page = btn.dataset.page;
            currentPage = page;
            loadPage(page);
        });
    });

    // ===== LOAD PAGE — TAMA NA ANG RELATIVE PATH! =====
    async function loadPage(page) {
        const config = pageConfig[page];
        if (!config) return;

        document.getElementById('page-title').textContent = config.title;
        document.getElementById('page-desc').textContent = config.desc;

        document.getElementById('content-area').innerHTML = `
            <div class="content-loader">
                <div class="loading-icon">⏳</div>
                <p>Loading ${config.title}...</p>
            </div>
        `;

        try {
            // ✅ TAMA — RELATIVE PATH LANG! Gumagana sa APK + Web!
            const response = await fetch(config.file);
            if (!response.ok) throw new Error("File not found");
            const html = await response.text();
            document.getElementById('content-area').innerHTML = html;
        } catch (error) {
            document.getElementById('content-area').innerHTML = `
                <div class="content-loader" style="border-color: #FF5722; background: rgba(255,87,34,0.1);">
                    <div class="loading-icon">📄</div>
                    <h3 style="color: #FF5722; margin-bottom: 8px;">${config.title}</h3>
                    <p style="color: #AAA; margin-bottom: 12px;">Handa na — file: <code>assets/${config.file}</code></p>
                    <p style="font-size: 13px;">Ilagay ang laman sa <strong>app/src/main/assets/${config.file}</strong> at kusang lalabas dito.</p>
                </div>
            `;
        }
    }

    // ✅ AUTO-LOAD DASHBOARD
    window.addEventListener('DOMContentLoaded', () => {
        loadPage('dashboard');
    });

    // ===== LOGOUT =====
    function logoutAdmin() {
        if (confirm('Gusto mo ba talagang mag-logout?')) {
            // ✅ Balik sa Login — Tugma sa Structure
            if (window.Android) {
                window.Android.closeAdmin(); // ← Para sa APK
            } else {
                window.location.href = 'index.html'; // ← Para sa Web
            }
        }
    }
</script>

</body>
</html>
