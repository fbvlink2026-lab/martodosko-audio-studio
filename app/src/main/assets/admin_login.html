<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Martodosko</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body {
            background: linear-gradient(135deg, #12121F, #1A1A3A);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
            color: #E0E0E0;
        }
        .login-box {
            background: #1E1E2F;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(64,224,208,0.15);
            width: 100%;
            max-width: 400px;
            border: 1px solid #2A2A4A;
        }
        h2 { text-align: center; color: #40E0D0; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #B0B0C0; font-size: 14px; }
        input {
            width: 100%; padding: 12px 15px; border-radius: 8px;
            border: 1px solid #3A3A5A; background: #252538;
            color: #fff; font-size: 15px;
            outline: none; transition: border 0.3s;
        }
        input:focus { border-color: #40E0D0; }
        button {
            width: 100%; padding: 13px; border-radius: 8px;
            border: none; background: linear-gradient(90deg, #40E0D0, #20B0A0);
            color: #000; font-weight: bold; font-size: 16px; cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.02); }
        .session-box {
            margin-top: 25px; padding: 15px;
            background: #19192C; border-radius: 10px;
            border-left: 3px solid #FFD700;
        }
        .session-box h3 { color: #FFD700; font-size: 14px; margin-bottom: 10px; }
        .session-item { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; border-bottom: 1px solid #2A2A4A; }
        .note { margin-top: 15px; font-size: 12px; color: #888; font-style: italic; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔐 ADMIN LOGIN</h2>

        <div id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Ilagay ang username">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Ilagay ang password">
            </div>
            <button onclick="login()">LOGIN</button>
            <p class="note">Tandaan: Ang mga detalye ay naka-save nang lokal lamang.</p>
        </div>

        <div id="sessionInfo" class="hidden">
            <div class="session-box">
                <h3>⏱ SESSION HISTORY</h3>
                <div class="session-item"><span>Huling Login:</span><span id="lastLogin">-</span></div>
                <div class="session-item"><span>Oras:</span><span id="sessHours">0 oras</span></div>
                <div class="session-item"><span>Araw:</span><span id="sessDays">0 araw</span></div>
                <div class="session-item"><span>Linggo:</span><span id="sessWeeks">0 linggo</span></div>
                <div class="session-item"><span>Buwan:</span><span id="sessMonths">0 buwan</span></div>
            </div>
            <div style="margin-top:20px; text-align:center;">
                <p style="color:#40E0D0; font-weight:bold;">✅ Naka-login bilang: <span id="userDisplay"></span></p>
                <button onclick="logout()" style="margin-top:15px; background:linear-gradient(90deg,#FF6B6B,#DD4444);">LOGOUT</button>
            </div>
        </div>
    </div>

    <script>
        let loginTime = null;

        function updateSessionInfo(lastLogin, hours, days, weeks, months, username) {
            if (username) {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('sessionInfo').classList.remove('hidden');
                document.getElementById('lastLogin').textContent = lastLogin;
                document.getElementById('sessHours').textContent = hours + ' oras';
                document.getElementById('sessDays').textContent = days + ' araw';
                document.getElementById('sessWeeks').textContent = weeks + ' linggo';
                document.getElementById('sessMonths').textContent = months + ' buwan';
                document.getElementById('userDisplay').textContent = username;
                loginTime = Date.now();
                startSessionTimer();
            }
        }

        function login() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            if (!user) { alert('Ilagay ang username!'); return; }

            // ✅ I-save sa SharedPreferences — papasa sa Kotlin
            Android.saveAdminLogin(user);

            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('sessionInfo').classList.remove('hidden');
            document.getElementById('userDisplay').textContent = user;
            document.getElementById('lastLogin').textContent = new Date().toLocaleString('tl-PH');
            loginTime = Date.now();
            startSessionTimer();
        }

        function logout() {
            Android.logoutAdmin();
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('sessionInfo').classList.add('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function startSessionTimer() {
            setInterval(() => {
                if (!loginTime) return;
                const elapsed = Date.now() - loginTime;
                const hours = Math.floor(elapsed / 3600000);
                const days = Math.floor(elapsed / 86400000);
                const weeks = Math.floor(days / 7);
                const months = Math.floor(days / 30);
                document.getElementById('sessHours').textContent = hours + ' oras';
                document.getElementById('sessDays').textContent = days + ' araw';
                document.getElementById('sessWeeks').textContent = weeks + ' linggo';
                document.getElementById('sessMonths').textContent = months + ' buwan';
            }, 60000); // ✅ Update bawat 1 minuto
        }
    </script>
</body>
</html>
