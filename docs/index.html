<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📢 Abiso — Martodosko Audio Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #0A0A12, #121224);
            min-height: 100vh;
            padding: 20px;
            color: #E0E0E0;
        }
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2A2A5A;
            border-top-color: #00FF88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-box {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid #F44336;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            color: #FF6B6B;
            max-width: 500px;
            margin: 20px auto;
        }
        .download-box {
            background: linear-gradient(135deg, #1A2E1F, #0F3D28);
            border: 1px solid #00FF88;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: 0 0 20px rgba(0,255,136,0.15);
        }
        .download-box h3 { color: #00FF88; font-size: 18px; margin-bottom: 8px; }
        .download-box p { color: #AAA; font-size: 13px; margin-bottom: 14px; }
        .download-btn {
            display: inline-block;
            background: linear-gradient(90deg, #00FF88, #00CC6E);
            color: #000;
            font-weight: bold;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0,255,136,0.4);
        }
        .download-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .version-info {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
        }
        .version-info strong { color: #40E0D0; }
        #content-container { max-width: 700px; margin: 0 auto; }
    </style>
</head>
<body>

    <div id="content-container">
        <!-- ✅ DOWNLOAD BUTTON — KUSANG KUKUNIN ANG APK MULA SA version.json -->
        <div class="download-box">
            <h3>📥 I-download ang Pinakabagong Bersyon</h3>
            <p>Martodosko Audio Studio — Android APK</p>
            <a id="download-link" class="download-btn" href="" disabled>⏳ Kinukuha ang bersyon...</a>
            <div class="version-info">
                Bersyon: <strong id="ver-number">—</strong> | Petsa: <strong id="ver-date">—</strong>
            </div>
        </div>

        <div class="loading">
            <div class="spinner"></div>
            <p>📤 Kinukuha ang abiso.html...</p>
        </div>
    </div>

    <script>
        // ==============================================
        // ✅ KUSANG HAHANAP NG APK — BASE LANG SA version.json!
        // JSON FORMAT: {"version":"1.0.211","apkFile":"Martodosko-Studio-v1.0.211.apk","released":"2026-09-18"}
        // ==============================================
        async function setupDownloadButton() {
            try {
                // 📍 BASAHIN ANG version.json — NASA IISANG FOLDER LANG
                const response = await fetch('version.json', { cache: 'no-store' });
                
                if (!response.ok) throw new Error('Hindi makuha ang version.json');
                
                // ✅ KUNIN ANG DATA MULA SA JSON — KAHIT ANONG PAGKAKABUO!
                const data = await response.json();
                
                // ✅ KUSANG KUNIN ANG MGA HALAGA — KAHIT ANONG PANGALAN NG KEY!
                const version = data.version || data.versionName || data.ver || 'Unknown';
                const apkName = data.apkFile || data.apk_filename || data.file || data.apk || `Martodosko-Studio-v${version}.apk`;
                const releaseDate = data.released || data.date || data.releaseDate || 'Unknown';
                
                // ✅ Ipakita ang bersyon at petsa
                document.getElementById('ver-number').textContent = version;
                document.getElementById('ver-date').textContent = releaseDate;
                
                // ✅ KUSANG BUUIN ANG LINK — Nasa docs/ ang APK, KASAMA NG JSON
                const downloadLink = document.getElementById('download-link');
                downloadLink.href = apkName; // KAPAREHONG FOLDER — direkta lang!
                downloadLink.textContent = `⬇️ I-download — v${version}`;
                downloadLink.download = apkName; // Pangalan ng file pag dinownload
                downloadLink.removeAttribute('disabled');
                
                console.log(`✅ Bersyon: ${version} | APK: ${apkName} | Petsa: ${releaseDate}`);
                console.log(`✅ Link: ${window.location.origin}${window.location.pathname.replace('index.html', '')}${apkName}`);
                
            } catch (err) {
                console.error('❌ Error:', err);
                const downloadLink = document.getElementById('download-link');
                downloadLink.textContent = '❌ Hindi makuha ang bersyon';
                downloadLink.style.opacity = '0.6';
            }
        }

        // ==============================================
        // ✅ IPAPAKITA ANG BUONG abiso.html — PARANG cat command
        // ==============================================
        async function loadAbiso() {
            const container = document.getElementById('content-container');
            const loading = container.querySelector('.loading');
            
            const possiblePaths = [
                'assets/abiso.html',
                './assets/abiso.html',
                '../assets/abiso.html',
                'abiso.html'
            ];

            let htmlContent = null;

            for (const path of possiblePaths) {
                try {
                    const response = await fetch(path, { cache: 'no-store' });
                    if (response.ok) {
                        htmlContent = await response.text();
                        break;
                    }
                } catch (e) {
                    continue;
                }
            }

            if (!htmlContent) {
                loading.innerHTML = `
                    <div class="error-box">
                        <h3>❌ Hindi makuha ang abiso.html</h3>
                        <p style="margin:10px 0; font-size:13px;">Sinubukan ang mga lokasyon:</p>
                        <code style="font-size:11px; color:#AAA;">${possiblePaths.join('<br>')}</code>
                        <p style="margin-top:15px; font-size:12px; color:#888;">
                            Siguraduhing nasa tamang folder ang <strong>assets/abiso.html</strong>
                        </p>
                    </div>
                `;
                return;
            }

            loading.outerHTML = htmlContent;
        }

        // 🚀 TAWAGIN LAHAT PAGKABUKAS NG PAGE
        document.addEventListener('DOMContentLoaded', async () => {
            await setupDownloadButton(); // ✅ Una — kunin ang APK mula sa JSON
            await loadAbiso();          // ✅ Pangalawa — ipakita ang abiso
        });
    </script>

</body>
</html>
