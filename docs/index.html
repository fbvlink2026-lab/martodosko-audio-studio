<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📢 Abiso — Martodosko Audio Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #0A0A12, #121224);
            min-height: 100vh;
            padding: 20px;
            color: #E0E0E0;
        }
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2A2A5A;
            border-top-color: #00FF88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-box {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid #F44336;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            color: #FF6B6B;
            max-width: 500px;
            margin: 20px auto;
        }
        .download-box {
            background: linear-gradient(135deg, #1A2E1F, #0F3D28);
            border: 1px solid #00FF88;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: 0 0 20px rgba(0,255,136,0.15);
        }
        .download-box h3 { color: #00FF88; font-size: 18px; margin-bottom: 8px; }
        .download-box p { color: #AAA; font-size: 13px; margin-bottom: 14px; }
        .download-btn {
            display: inline-block;
            background: linear-gradient(90deg, #00FF88, #00CC6E);
            color: #000;
            font-weight: bold;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0,255,136,0.4);
        }
        .download-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .version-info {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
        }
        .version-info strong { color: #40E0D0; }
        #content-container { max-width: 700px; margin: 0 auto; }
    </style>
</head>
<body>

    <div id="content-container">
        <!-- ✅ DOWNLOAD BUTTON — KUSANG KUKUNIN ANG APK MULA SA version.json -->
        <div class="download-box">
            <h3>📥 I-download ang Pinakabagong Bersyon</h3>
            <p>Martodosko Audio Studio — Android APK</p>
            <a id="download-link" class="download-btn" href="" disabled>⏳ Kinukuha ang bersyon...</a>
            <div class="version-info">
                Bersyon: <strong id="ver-number">—</strong> | Petsa: <strong id="ver-date">—</strong>
            </div>
        </div>

        <div class="loading">
            <div class="spinner"></div>
            <p>📤 Kinukuha ang abiso.html mula sa GitHub...</p>
        </div>
    </div>

    <script>
        // ==============================================
        // ⚙️ I-UPDATE ANG MGA ITO KUNG KAILANGAN!
        // ==============================================
        const GITHUB_USER = "martodosko";
        const GITHUB_REPO = "martodosko-audio-studio";
        const GITHUB_BRANCH = "main"; // o "master"

        // ==============================================
        // ✅ DOWNLOAD BUTTON — BASE LANG SA version.json!
        // ==============================================
        async function setupDownloadButton() {
            try {
                const response = await fetch('version.json', { cache: 'no-store' });
                if (!response.ok) throw new Error('Hindi makuha ang version.json');
                const data = await response.json();
                
                const version = data.version || 'Unknown';
                const apkName = data.apkFile || `Martodosko-Studio-v${version}.apk`;
                const releaseDate = data.released || 'Unknown';
                
                document.getElementById('ver-number').textContent = version;
                document.getElementById('ver-date').textContent = releaseDate;
                
                const downloadLink = document.getElementById('download-link');
                downloadLink.href = apkName;
                downloadLink.textContent = `⬇️ I-download — v${version}`;
                downloadLink.download = apkName;
                downloadLink.removeAttribute('disabled');
                
            } catch (err) {
                console.error('❌ Error:', err);
                const downloadLink = document.getElementById('download-link');
                downloadLink.textContent = '❌ Hindi makuha ang bersyon';
                downloadLink.style.opacity = '0.6';
            }
        }

        // ==============================================
        // ✅ GITHUB RAW — DIREKTA MULA SA ORIHINAL! WALANG KOPYA!
        // ==============================================
        async function loadAbiso() {
            const container = document.getElementById('content-container');
            const loading = container.querySelector('.loading');
            
            // 🔥 DIREKTANG KUKUNIN MULA SA GITHUB — WALANG DOBLE NA FILE!
            const rawUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/app/src/main/assets/abiso.html`;
            
            console.log(`🔍 Kinukuha mula sa: ${rawUrl}`);

            try {
                const response = await fetch(rawUrl, { cache: 'no-store' });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const htmlContent = await response.text();
                console.log(`✅ Matagumpay na kinuha ang abiso.html!`);
                
                // ✅ IPALIT ANG LAMAN — PARANG PHP INCLUDE!
                loading.outerHTML = htmlContent;
                
            } catch (err) {
                console.error('❌ GitHub Raw Error:', err);
                loading.innerHTML = `
                    <div class="error-box">
                        <h3>❌ Hindi makuha ang abiso.html</h3>
                        <p style="margin:10px 0; font-size:13px;">Sinubukan ang:</p>
                        <code style="font-size:11px; color:#AAA; word-break:break-all;">${rawUrl}</code>
                        <p style="margin-top:10px; color:#FF6B6B;">${err.message}</p>
                        <p style="margin-top:15px; font-size:12px; color:#FFD700;">
                            💡 Siguraduhin na tama ang username, repo, at branch sa itaas.
                        </p>
                    </div>
                `;
            }
        }

        // 🚀 TAWAGIN LAHAT PAGKABUKAS NG PAGE
        document.addEventListener('DOMContentLoaded', async () => {
            await setupDownloadButton();
            await loadAbiso();
        });
    </script>

</body>
</html>
