<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Martodosko Audio Studio - Prototype v2.4</title>
    
    <!-- CSS STYLESHEETS -->
    <link rel="stylesheet" href="./assets/css/theme.css">
    <link rel="stylesheet" href="./assets/css/layout.css">
</head>
<body>

    <!-- APP CONTAINER -->
    <div id="app-container">
        
        <!-- HEADER / TITLE BAR -->
        <header class="app-header">
            <h1>MARTODOSKO STUDIO</h1>
            <span id="user-role-badge" class="badge guest">GUEST MODE</span>
        </header>

        <!-- MAIN CONTENT AREA -->
        <main id="content-area">
            
            <!-- 1. MIXER MONITOR SECTION -->
            <section id="screen-mixer" class="screen-section hidden">
                <div class="tab-bar-inner">
                    <button class="channel-tab active" data-channel="vocal">VOCAL CH</button>
                    <button class="channel-tab" data-channel="guitar">GUITAR CH</button>
                </div>
                
                <!-- Dynamic Container for Mixer Controls -->
                <div id="mixer-content-wrapper">
                    
                    <!-- VOCAL CHANNEL STRIP -->
                    <div class="mixer-strip">
                        <h3>VOCAL CHANNEL</h3>
                        
                        <div class="mixer-param">
                            <label>INPUT GAIN (Synced with Board FX)</label>
                            <input type="range" id="input-mixer-vocal-gain" min="0" max="100" value="50" style="width:100%;">
                            <span class="value-display" id="display-mixer-vocal-gain">50%</span>
                        </div>
                        
                        <div class="mixer-param">
                            <label>OUTPUT VOL (Synced with Board VOL)</label>
                            <input type="range" id="slider-mixer-vocal-vol" min="0" max="100" value="80" style="width:100%;">
                            <span class="value-display" id="display-mixer-vocal-vol">80%</span>
                        </div>
                    </div>

                    <!-- GUITAR CHANNEL STRIP -->
                    <div class="mixer-strip" style="border-color:#FF9800;">
                        <h3>GUITAR CHANNEL</h3>
                        
                        <div class="mixer-param">
                            <label>DRIVE AMOUNT (Synced with Board Drive)</label>
                            <input type="range" id="input-mixer-guitar-drive" min="0" max="100" value="65" style="width:100%;">
                            <span class="value-display" id="display-mixer-guitar-drive">65%</span>
                        </div>
                        
                        <div class="mixer-param">
                            <label>LEVEL (Synced with Board Level)</label>
                            <input type="range" id="slider-mixer-guitar-level" min="0" max="100" value="75" style="width:100%;">
                            <span class="value-display" id="display-mixer-guitar-level">75%</span>
                        </div>
                    </div>

                </div>
            </section>

            <!-- 2. PRESET LIBRARY SECTION -->
            <section id="screen-library" class="screen-section hidden">
                <div class="library-header">
                    <input type="text" id="preset-search" placeholder="Search presets...">
                    <button id="btn-save-current" class="action-btn primary">SAVE CURRENT STATE</button>
                </div>
                
                <!-- List of Presets -->
                <div id="preset-list-container" class="scrollable-list">
                    <!-- Injected by ui-library.js -->
                    <p>No presets found.</p>
                </div>
            </section>

            <!-- 3. PEDAL BOARD SECTION (DEFAULT VIEW) -->
            <section id="screen-board" class="screen-section visible">
                <div class="board-grid">
                    
                    <!-- VOCAL CARD -->
                    <div class="pedal-card">
                        <div class="card-header">
                            <span class="card-title">VOCAL</span>
                            <div id="switch-power-vocal" class="power-switch on"></div>
                        </div>
                        
                        <div class="controls-row">
                            <div class="control-slot">
                                <canvas id="knob-board-vocal-fx" width="80" height="80" class="knob-canvas-board"></canvas>
                                <label class="control-label">FX AMT</label>
                            </div>
                            <div class="control-slot">
                                <canvas id="knob-board-vocal-ng" width="80" height="80" class="knob-canvas-board"></canvas>
                                <label class="control-label">GATE</label>
                            </div>
                        </div>
                        
                        <div class="controls-row" style="margin-top:auto;">
                             <div class="control-slot">
                                <canvas id="knob-board-vocal-vol" width="100" height="100" class="knob-canvas-large"></canvas>
                                <label class="control-label">VOL</label>
                            </div>
                        </div>
                    </div>

                    <!-- GUITAR CARD -->
                    <div class="pedal-card" style="border-color:#FF9800;">
                         <div class="card-header">
                            <span class="card-title" style="color:#FF9800;">GUITAR</span>
                            <div id="switch-power-guitar" class="power-switch on"></div>
                        </div>
                        
                        <div class="controls-row">
                            <div class="control-slot">
                                <canvas id="knob-board-guitar-drive" width="80" height="80" class="knob-canvas-board"></canvas>
                                <label class="control-label">DRIVE</label>
                            </div>
                            <div class="control-slot">
                                <canvas id="knob-board-guitar-ng" width="80" height="80" class="knob-canvas-board"></canvas>
                                <label class="control-label">GATE</label>
                            </div>
                        </div>
                        
                        <div class="controls-row" style="margin-top:auto;">
                             <div class="control-slot">
                                <canvas id="knob-board-guitar-level" width="100" height="100" class="knob-canvas-large"></canvas>
                                <label class="control-label">LEVEL</label>
                            </div>
                        </div>
                    </div>

                </div>
            </section>

            <!-- 4. SETTINGS SECTION -->
            <section id="screen-settings" class="screen-section hidden">
                <div class="settings-group">
                    <h3>AUDIO OUTPUT</h3>
                    <div class="setting-item">
                        <label>Buffer Size</label>
                        <select id="buffer-size-select">
                            <option value="64">64 Samples (Low Latency)</option>
                            <option value="128">128 Samples</option>
                            <option value="256">256 Samples (Stable)</option>
                        </select>
                    </div>
                </div>
                <div class="settings-group">
                    <h3>ACCOUNT</h3>
                    <button id="btn-toggle-role" class="action-btn secondary">SWITCH TO MEMBER MODE (TEST)</button>
                </div>
            </section>

            <!-- 5. MORE MENU SECTION -->
            <section id="screen-more" class="screen-section hidden">
                <div class="menu-list">
                    <a href="#" class="menu-item">Clans & Community</a>
                    <a href="#" class="menu-item">Help Center</a>
                    <a href="#" class="menu-item danger">Logout</a>
                </div>
            </section>

        </main>

        <!-- BOTTOM NAVIGATION BAR -->
        <nav id="bottom-nav">
            <button class="nav-item" data-target="screen-mixer">
                <span class="icon">🎚️</span>
                <span class="label">Mixer</span>
            </button>
            <button class="nav-item" data-target="screen-library">
                <span class="icon">📋</span>
                <span class="label">Presets</span>
            </button>
            <button class="nav-item active" data-target="screen-board">
                <span class="icon">🎛️</span>
                <span class="label">Board</span>
            </button>
            <button class="nav-item" data-target="screen-settings">
                <span class="icon">⚙️</span>
                <span class="label">Settings</span>
            </button>
            <button class="nav-item" data-target="screen-more">
                <span class="icon">☰</span>
                <span class="label">More</span>
            </button>
        </nav>

    </div>

    <!-- JAVASCRIPT FILES -->
    <!-- ORDER MATTERS: Core first, then Components, then UI Logic -->
    <script src="./assets/js/core.js"></script>
    <script src="./assets/js/storage.js"></script>
    <script src="./assets/js/components/knob.js"></script>
    <script src="./assets/js/ui-controller.js"></script>
    <script src="./assets/js/ui-mixer.js"></script>
    <script src="./assets/js/ui-board.js"></script>
    <script src="./assets/js/ui-library.js"></script>
    <script src="./assets/js/app.js"></script>

</body>
</html>
