<svg width="900" height="750" xmlns="http://www.w3.org/2000/svg" background="#f8f9fa">
  <defs>
    <style>
      .box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; rx: 8; }
      .section { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; rx: 6; }
      .danger { fill: #ffebee; stroke: #d32f2f; stroke-width: 2; rx: 6; }
      .safe { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2; rx: 6; }
      .text { font-family: Arial; font-size: 13px; }
      .title { font-family: Arial; font-size: 16px; font-weight: bold; }
      .small { font-family: Arial; font-size: 11px; }
      .wire { stroke: #333; stroke-width: 1.5; }
      .red { stroke: #d32f2f; stroke-width: 2; }
      .black { stroke: #000; stroke-width: 2; }
      .blue { stroke: #1976d2; stroke-width: 2; }
      .green { stroke: #388e3c; stroke-width: 2; }
      .arrow { marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" class="title">MARTODOSKO DIGITAL MULTI-TESTER</text>
  <text x="450" y="52" text-anchor="middle" class="text">External Module Diagram - High Voltage, Current, Temp</text>

  <!-- INPUT PROBES -->
  <rect x="30" y="80" width="180" height="140" class="box"/>
  <text x="120" y="105" text-anchor="middle" class="title" font-size="14">INPUT PROBES</text>
  <circle cx="60" cy="135" r="8" fill="#d32f2f"/>
  <text x="75" y="140" class="text">V+ Red</text>
  <circle cx="60" cy="165" r="8" fill="#333"/>
  <text x="75" y="170" class="text">V- Black GND</text>
  <circle cx="60" cy="200" r="8" fill="#f57c00"/>
  <text x="75" y="205" class="text">I Current CT</text>

  <!-- VOLTAGE DIVIDER -->
  <rect x="250" y="80" width="220" height="140" class="danger"/>
  <text x="360" y="105" text-anchor="middle" class="title" font-size="14">VOLTAGE DIVIDER PROTECTION</text>
  <rect x="270" y="120" width="60" height="30" fill="#fff" stroke="#333" rx="3"/>
  <text x="300" y="140" text-anchor="middle" class="small">R1 1M 1W HV</text>
  <rect x="350" y="120" width="60" height="30" fill="#fff" stroke="#333" rx="3"/>
  <text x="380" y="140" text-anchor="middle" class="small">R2 10k 1% Prec</text>
  <rect x="430" y="120" width="35" height="30" fill="#ffcdd2" stroke="#d32f2f" rx="3"/>
  <text x="448" y="140" text-anchor="middle" class="small">3.3V ZENER</text>
  <rect x="270" y="165" width="60" height="25" fill="#fff" stroke="#333" rx="3"/>
  <text x="300" y="182" text-anchor="middle" class="small">1N4148 AC Rect</text>
  <line x1="210" y1="135" x2="270" y2="135" class="red" arrow/>
  <line x1="210" y1="165" x2="270" y2="180" class="black" arrow/>

  <!-- CURRENT MEASUREMENT -->
  <rect x="500" y="80" width="200" height="140" class="section"/>
  <text x="600" y="105" text-anchor="middle" class="title" font-size="14">CURRENT MEASUREMENT</text>
  <ellipse cx="540" cy="145" rx="30" ry="35" fill="#fff" stroke="#f57c00" stroke-width="2"/>
  <text x="540" y="150" text-anchor="middle" class="small">CT Clamp 30A AC</text>
  <rect x="595" y="130" width="50" height="30" fill="#fff" stroke="#333" rx="3"/>
  <text x="620" y="150" text-anchor="middle" class="small">10 Ohm Burden</text>
  <rect x="530" y="180" width="50" height="25" fill="#fff" stroke="#333" rx="3"/>
  <text x="555" y="197" text-anchor="middle" class="small">0.1 Ohm Shunt</text>
  <rect x="595" y="180" width="50" height="25" fill="#fff" stroke="#333" rx="3"/>
  <text x="620" y="197" text-anchor="middle" class="small">LM358 Amp</text>
  <line x1="210" y1="200" x2="510" y2="145" class="wire" arrow/>

  <!-- TEMPERATURE REFRIGERATION -->
  <rect x="30" y="250" width="180" height="120" class="safe"/>
  <text x="120" y="275" text-anchor="middle" class="title" font-size="14">REFRIGERATION TEMP</text>
  <circle cx="70" cy="300" r="25" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="70" y="290" text-anchor="middle" class="small">NTC 10k Probe</text>
  <text x="70" y="310" text-anchor="middle" class="small">-50 to 150 C</text>
  <rect x="115" y="290" width="50" height="30" fill="#fff" stroke="#333" rx="3"/>
  <text x="140" y="310" text-anchor="middle" class="small">10k Ref</text>
  <text x="120" y="340" text-anchor="middle" class="small">Evap Condenser Compressor</text>

  <!-- 220V ISOLATED -->
  <rect x="250" y="250" width="220" height="120" class="danger"/>
  <text x="360" y="275" text-anchor="middle" class="title" font-size="14">220V AC ISOLATED</text>
  <rect x="270" y="290" width="80" height="50" fill="#fef0f0" stroke="#d32f2f" rx="3"/>
  <text x="310" y="310" text-anchor="middle" class="text">HLW8012 Opto</text>
  <text x="310" y="335" text-anchor="middle" class="small" fill="#d32f2f">ISOLATED SAFE</text>
  <text x="360" y="350" text-anchor="middle" class="small">Mains Fridge Power</text>

  <!-- SIGNAL CONDITIONING -->
  <rect x="500" y="250" width="200" height="120" class="box"/>
  <text x="600" y="275" text-anchor="middle" class="title" font-size="14">SIGNAL CONDITIONING</text>
  <rect x="520" y="290" width="160" height="25" fill="#fff" stroke="#333" rx="3"/>
  <text x="600" y="308" text-anchor="middle" class="small">Filter and 3.3V Protect</text>
  <rect x="520" y="325" width="160" height="25" fill="#fff" stroke="#333" rx="3"/>
  <text x="600" y="343" text-anchor="middle" class="small">Shift to 0 to 3.3V</text>
  <line x1="470" y1="150" x2="500" y2="300" class="wire" arrow/>
  <line x1="700" y1="150" x2="600" y2="250" class="wire" arrow/>
  <line x1="210" y1="310" x2="500" y2="330" class="wire" arrow/>
  <line x1="470" y1="310" x2="500" y2="315" class="wire" arrow/>

  <!-- PHONE INTERFACE -->
  <rect x="250" y="420" width="450" height="130" class="safe"/>
  <text x="475" y="445" text-anchor="middle" class="title" font-size="14">PHONE INTERFACE AND APP</text>
  <rect x="280" y="470" width="120" height="60" fill="#fff" stroke="#333" rx="5"/>
  <text x="340" y="490" text-anchor="middle" class="text">3.5mm Audio Jack</text>
  <text x="340" y="510" text-anchor="middle" class="small">L-Ch Voltage R-Ch Current</text>
  <rect x="420" y="470" width="120" height="60" fill="#fff" stroke="#333" rx="5"/>
  <text x="480" y="490" text-anchor="middle" class="text">USB-C OTG</text>
  <text x="480" y="510" text-anchor="middle" class="small">Digital ADC More Accurate</text>
  <rect x="560" y="470" width="110" height="60" fill="#e3f2fd" stroke="#1976d2" rx="5"/>
  <text x="615" y="490" text-anchor="middle" class="text">APP</text>
  <text x="615" y="510" text-anchor="middle" class="small">Calc Display Log Graph</text>
  <line x1="600" y1="370" x2="600" y2="420" class="blue" stroke-width="3" arrow/>

  <!-- LEGEND -->
  <text x="50" y="580" class="title" font-size="13">LEGEND AND RANGES</text>
  <text x="50" y="605" class="small">DC Voltage 0 to 30V direct up to 400V w divider</text>
  <text x="50" y="625" class="small">AC Voltage 0 to 270V isolated HLW8012 recommended</text>
  <text x="50" y="645" class="small">Current 0 to 30A AC CT 0 to 20A DC Shunt</text>
  <text x="50" y="665" class="small">Temp -50C to 150C Refrigeration Pipes</text>
  <text x="50" y="690" class="small" fill="#d32f2f">SAFETY All inputs limited to 3.3V max before phone 220V ALWAYS ISOLATED</text>

</svg>
